<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Control Financiero ARS Pro</title>

    <!-- React 18 Core -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <!-- React Dependencies for Recharts -->
    <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
    <script src="https://unpkg.com/react-is@18.2.0/umd/react-is.production.min.js"></script>

    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Recharts (after React dependencies) -->
    <script src="https://unpkg.com/recharts@2.5.0/umd/Recharts.js"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: 'Inter', system-ui, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
            min-height: 100vh;
        }

        .glass {
            backdrop-filter: blur(20px);
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .glass-dark {
            backdrop-filter: blur(20px);
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .blob1 {
            position: fixed;
            top: -20%;
            left: -10%;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.3) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .blob2 {
            position: fixed;
            bottom: -30%;
            right: -15%;
            width: 700px;
            height: 700px;
            background: radial-gradient(circle, rgba(236, 72, 153, 0.2) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .blob3 {
            position: fixed;
            top: 40%;
            right: 20%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(34, 211, 238, 0.15) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes popIn {
            from {
                opacity: 0;
                transform: scale(0.8);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes stagger {
            from {
                opacity: 0;
                transform: translateX(-10px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .animate-fade {
            animation: fadeIn 0.4s ease-out forwards;
        }

        .animate-slide {
            animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .animate-pop {
            animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        .animate-stagger {
            animation: stagger 0.3s ease-out forwards;
        }

        .custom-scroll::-webkit-scrollbar {
            width: 4px;
        }

        .custom-scroll::-webkit-scrollbar-track {
            background: transparent;
        }

        .custom-scroll::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }

        .toast {
            animation: slideUp 0.3s ease-out, fadeIn 0.3s ease-out reverse forwards 2.5s;
        }

        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
        }
    </style>
</head>

<body class="text-white overflow-x-hidden">
    <div class="blob1"></div>
    <div class="blob2"></div>
    <div class="blob3"></div>
    <div id="root" class="relative z-10"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect, useCallback, useRef } = React;
        const { PieChart, Pie, Cell, AreaChart, Area, XAxis, YAxis, Tooltip, ResponsiveContainer, Legend } = Recharts;

        // ═══════════════════════════════════════════════════════════════
        // FASE 1: CONFIGURACIÓN Y MODELO DE DATOS
        // ═══════════════════════════════════════════════════════════════

        const firebaseConfig = {
            apiKey: "AIzaSyCiJwLv-jw1EQT3FNT6gdWw2NV51UxvbQU",
            authDomain: "finanzas-44f11.firebaseapp.com",
            projectId: "finanzas-44f11",
            storageBucket: "finanzas-44f11.firebasestorage.app",
            messagingSenderId: "403874855146",
            appId: "1:403874855146:web:1f0bc48e339e06316cff93"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const appId = 'finanzas-44f11-app';

        // CONSTANTES DE MODELO DE DATOS
        const PILARES = {
            gastos: { nombre: 'Gasto', tipo: 'gasto', color: '#f43f5e', icon: '💸', subcategorias: ['Alquiler', 'Luz', 'Agua', 'Gas', 'Internet', 'Servicio de Streaming', 'Personal', 'Ocio', 'Limpieza e Higiene', 'Movilidad', 'Otros'] },
            ahorro: { nombre: 'Ahorro', tipo: 'ahorro', color: '#3b82f6', icon: '🏦', subcategorias: ['Ahorro en pesos', 'Ahorro personal'] },
            inversiones: { nombre: 'Inversión', tipo: 'inversion', color: '#06b6d4', icon: '📈', subcategorias: ['IOL Letras', 'IOL Acciones', 'IOL CEDEARS', 'Fondo Común de Inversiones (FCI)'] },
            ingresos: { nombre: 'Ingreso', tipo: 'ingreso', color: '#10b981', icon: '💰', subcategorias: ['Sueldo', 'Marketing', 'Moto (Uber/Didi)', 'Ventas', 'Otros'] }
        };

        const MEDIOS_PAGO = [
            { id: 'efectivo', nombre: 'Efectivo/Débito', icon: '💵' },
            { id: 'visa', nombre: 'Visa', icon: '💳' },
            { id: 'mastercard', nombre: 'Mastercard', icon: '💳' },
            { id: 'amex', nombre: 'Amex', icon: '💳' },
            { id: 'otro_tarjeta', nombre: 'Otra Tarjeta', icon: '💳' }
        ];

        const TABS = [
            { id: 'dashboard', nombre: 'Resumen', icon: '📊' },
            { id: 'gastos', nombre: 'Gastos', icon: '💸' },
            { id: 'tarjetas', nombre: 'Tarjetas', icon: '💳' },
            { id: 'ahorro', nombre: 'Ahorro', icon: '🏦' },
            { id: 'inversiones', nombre: 'Inversiones', icon: '📈' },
            { id: 'ingresos', nombre: 'Ingresos', icon: '💰' },
            { id: 'analisis', nombre: 'Análisis', icon: '📉' },
            { id: 'perfil', nombre: 'Perfil', icon: '👤' }
        ];

        const MOTIVATIONAL_PHRASES = [
            "El éxito financiero no es cuánto ganas, sino cuánto conservas. 💰",
            "La mejor inversión que puedes hacer es en ti mismo. 🚀",
            "Pequeños ahorros hoy construyen grandes futuros mañana. 🏗️",
            "No ahorres lo que te sobra después de gastar; gasta lo que te sobra después de ahorrar. 📉",
            "El dinero es un gran siervo pero un mal amo. 🧠",
            "Tu libertad financiera comienza con un presupuesto responsable. 📋",
            "Cada peso cuenta en la carrera hacia tus metas. 🏁",
            "La disciplina financiera es el puente entre tus metas y tus logros. 🌉",
            "No mires el reloj de la riqueza; planta las semillas del ahorro. 🌱",
            "Gastar menos de lo que ganas es la base de la abundancia. 💎"
        ];

        // ═══════════════════════════════════════════════════════════════
        // ICONOS SVG
        // ═══════════════════════════════════════════════════════════════
        const Icons = {
            Plus: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M12 5v14M5 12h14" /></svg>,
            X: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M18 6L6 18M6 6l12 12" /></svg>,
            Trash: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2" /></svg>,
            Edit: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z" /></svg>,
            Alert: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0zM12 9v4M12 17h.01" /></svg>,
            Check: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M20 6L9 17l-5-5" /></svg>,
            Loader: () => <svg className="animate-spin" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 12a9 9 0 11-6.219-8.56" /></svg>,
            Filter: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z" /></svg>,
            Calendar: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2" /><line x1="16" y1="2" x2="16" y2="6" /><line x1="8" y1="2" x2="8" y2="6" /><line x1="3" y1="10" x2="21" y2="10" /></svg>,
            ChevronDown: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M6 9l6 6 6-6" /></svg>,
            Tarjeta: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="2" y="5" width="20" height="14" rx="2" /><line x1="2" y1="10" x2="22" y2="10" /></svg>,
            Trend: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18" /><polyline points="17 6 23 6 23 12" /></svg>,
            User: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2" /><circle cx="12" cy="7" r="4" /></svg>,
            LogOut: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9" /></svg>,
            Store: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z" /><polyline points="9 22 9 12 15 12 15 22" /></svg>
        };

        // ═══════════════════════════════════════════════════════════════
        // UTILIDADES
        // ═══════════════════════════════════════════════════════════════
        const formatARS = (v) => new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS', maximumFractionDigits: 0 }).format(v || 0);
        const today = () => new Date().toISOString().split('T')[0];

        // ═══════════════════════════════════════════════════════════════
        // COMPONENTES DE APOYO
        // ═══════════════════════════════════════════════════════════════

        const AuthView = () => {
            const [isLogin, setIsLogin] = useState(true);
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState(null);

            const handleGoogleLogin = async () => {
                setLoading(true);
                setError(null);
                try {
                    const provider = new firebase.auth.GoogleAuthProvider();
                    await auth.signInWithPopup(provider);
                } catch (e) {
                    console.error('Auth Error:', e);
                    if (e.code === 'auth/operation-not-supported-in-this-environment') {
                        setError('Ambiente no preparado. Debes usar un servidor local (http/https).');
                    } else if (e.code === 'auth/unauthorized-domain') {
                        setError('Dominio no autorizado en Firebase (localhost).');
                    } else {
                        setError(e.message);
                    }
                } finally { setLoading(false); }
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                setLoading(true);
                setError(null);
                try {
                    if (isLogin) {
                        await auth.signInWithEmailAndPassword(email, password);
                    } else {
                        await auth.createUserWithEmailAndPassword(email, password);
                    }
                } catch (e) {
                    setError(e.message);
                } finally { setLoading(false); }
            };

            return (
                <div className="min-h-screen flex items-center justify-center p-6 bg-[#0f172a] relative overflow-hidden">
                    {/* Blobs de fondo premium */}
                    <div className="absolute top-0 -left-48 w-96 h-96 bg-indigo-600/20 rounded-full blur-[120px] animate-blob"></div>
                    <div className="absolute bottom-0 -right-48 w-96 h-96 bg-purple-600/20 rounded-full blur-[120px] animate-blob delay-1000"></div>

                    <div className="glass p-1 w-full max-w-md rounded-[3rem] border border-white/10 shadow-2xl relative z-10">
                        <div className="p-8 md:p-10 rounded-[2.9rem] bg-slate-900/50 backdrop-blur-3xl">
                            <div className="text-center mb-8">
                                <div className="w-16 h-16 bg-gradient-to-tr from-indigo-600 to-purple-600 rounded-2xl flex items-center justify-center text-3xl mb-6 mx-auto shadow-[0_0_30px_rgba(79,70,229,0.4)] animate-pop">
                                    <span>💎</span>
                                </div>
                                <h1 className="text-3xl font-black tracking-tight text-white mb-2">
                                    {isLogin ? 'Bienvenido de nuevo' : 'Crea tu Cuenta'}
                                </h1>
                                <p className="text-white/40 text-[10px] uppercase font-bold tracking-[0.2em]">
                                    Tus finanzas seguras y en la nube
                                </p>
                            </div>

                            <div className="bg-indigo-500/10 border border-indigo-500/20 p-4 rounded-2xl mb-8">
                                <p className="text-[10px] text-indigo-300 font-bold uppercase leading-relaxed text-center">
                                    🛡️ Tus datos se cifran y sincronizan automáticamente entre todos tus dispositivos de forma segura.
                                </p>
                            </div>

                            <form onSubmit={handleSubmit} className="space-y-4">
                                <div>
                                    <input
                                        type="email"
                                        required
                                        value={email}
                                        onChange={e => setEmail(e.target.value)}
                                        className="w-full p-4 bg-white/5 border border-white/10 rounded-2xl outline-none focus:border-indigo-500 transition-all font-medium text-sm text-white"
                                        placeholder="Tu correo electrónico"
                                    />
                                </div>
                                <div>
                                    <input
                                        type="password"
                                        required
                                        value={password}
                                        onChange={e => setPassword(e.target.value)}
                                        className="w-full p-4 bg-white/5 border border-white/10 rounded-2xl outline-none focus:border-indigo-500 transition-all font-medium text-sm text-white"
                                        placeholder="Tu contraseña"
                                    />
                                </div>

                                {error && (
                                    <div className="p-3 bg-rose-500/10 border border-rose-500/20 rounded-xl animate-fade">
                                        <p className="text-rose-400 text-[9px] font-bold uppercase text-center">{error}</p>
                                    </div>
                                )}

                                <button
                                    type="submit"
                                    disabled={loading}
                                    className="w-full bg-indigo-600 hover:bg-indigo-500 text-white py-4 rounded-2xl font-black text-xs uppercase tracking-widest transition-all shadow-lg shadow-indigo-600/20 active:scale-95 flex items-center justify-center"
                                >
                                    {loading ? <Icons.Loader /> : (isLogin ? 'Entrar ahora' : 'Empezar ahora')}
                                </button>
                            </form>

                            <div className="relative my-8">
                                <div className="absolute inset-0 flex items-center"><div className="w-full border-t border-white/5"></div></div>
                                <div className="relative flex justify-center text-[9px] uppercase font-black tracking-widest text-white/20"><span className="bg-[#1e293b] px-4">Acceso rápido</span></div>
                            </div>

                            <button
                                onClick={handleGoogleLogin}
                                disabled={loading}
                                className="w-full bg-white text-slate-900 py-4 rounded-2xl font-black text-xs uppercase tracking-widest transition-all hover:bg-gray-100 flex items-center justify-center gap-3 active:scale-95"
                            >
                                <svg className="w-4 h-4" viewBox="0 0 24 24"><path fill="currentColor" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" /><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" /><path fill="#FBBC05" d="M5.84 14.1c-.22-.66-.35-1.36-.35-2.1s.13-1.44.35-2.1V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l3.66-2.84z" /><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" /></svg>
                                Google
                            </button>

                            <button
                                onClick={() => setIsLogin(!isLogin)}
                                className="w-full mt-6 text-indigo-400 text-[10px] font-bold uppercase tracking-widest hover:text-indigo-300 transition-colors"
                            >
                                {isLogin ? '¿No tienes cuenta? Regístrate gratis' : 'Ya tengo cuenta, quiero entrar'}
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const ProfileView = ({ user, profile, setProfile, onLogout, onDeleteAccount, totals, comparisonData, insights, syncInfo }) => {
            const [newStore, setNewStore] = useState('');
            const [newInversion, setNewInversion] = useState('');
            const [isEditingInfo, setIsEditingInfo] = useState(false);
            const [tempInfo, setTempInfo] = useState({ nombre: '', cuil: '' });

            // Frase del día basada en la fecha
            const quote = useMemo(() => {
                const dayOfYear = Math.floor((new Date() - new Date(new Date().getFullYear(), 0, 0)) / 1000 / 60 / 60 / 24);
                return MOTIVATIONAL_PHRASES[dayOfYear % MOTIVATIONAL_PHRASES.length];
            }, []);

            const handleAddStore = () => {
                if (!newStore.trim()) return;
                if (profile.tiendasFrecuentes.includes(newStore.trim())) return;
                setProfile(prev => ({ ...prev, tiendasFrecuentes: [...prev.tiendasFrecuentes, newStore.trim()] }));
                setNewStore('');
            };

            const handleAddInversion = () => {
                if (!newInversion.trim()) return;
                if (profile.inversionesFrecuentes?.includes(newInversion.trim())) return;
                setProfile(prev => ({ ...prev, inversionesFrecuentes: [...(prev.inversionesFrecuentes || []), newInversion.trim()] }));
                setNewInversion('');
            };

            const handleRemoveStore = (store) => {
                setProfile(prev => ({ ...prev, tiendasFrecuentes: prev.tiendasFrecuentes.filter(s => s !== store) }));
            };

            const handleRemoveInversion = (inv) => {
                setProfile(prev => ({ ...prev, inversionesFrecuentes: prev.inversionesFrecuentes.filter(s => s !== inv) }));
            };

            const [selectedPilar, setSelectedPilar] = useState('gastos');
            const [newSubcategory, setNewSubcategory] = useState('');

            // Estado para creación de pilares
            const [showPilarCreator, setShowPilarCreator] = useState(false);
            const [newPilar, setNewPilar] = useState({ nombre: '', icon: '📂', color: '#6366f1', tipo: 'gasto' });

            const handleAddPilar = () => {
                if (!newPilar.nombre.trim()) return;
                const id = 'pilar_' + Date.now();
                const updatedCats = {
                    ...(profile.categories || PILARES),
                    [id]: {
                        nombre: newPilar.nombre.trim(),
                        icon: newPilar.icon,
                        color: newPilar.color,
                        tipo: newPilar.tipo,
                        subcategorias: ['Otros']
                    }
                };
                setProfile(prev => ({ ...prev, categories: updatedCats }));
                setShowPilarCreator(false);
                setNewPilar({ nombre: '', icon: '📂', color: '#6366f1', tipo: 'gasto' });
                showToast('Pilar creado con éxito');
            };

            const handleRemovePilar = (id) => {
                const defaults = ['gastos', 'ahorro', 'inversiones', 'ingresos'];
                if (defaults.includes(id)) {
                    showToast('No se pueden borrar las categorías principales', 'error');
                    return;
                }
                const updatedCats = { ...profile.categories };
                delete updatedCats[id];
                setProfile(prev => ({ ...prev, categories: updatedCats }));
                if (selectedPilar === id) setSelectedPilar('gastos');
                showToast('Pilar eliminado');
            };

            const handleAddSubcategory = () => {
                const sub = newSubcategory.trim();
                if (!sub) return;

                const currentCats = profile.categories || PILARES;
                const pilar = currentCats[selectedPilar];

                if (!pilar) {
                    showToast('Pilar no encontrado', 'error');
                    return;
                }

                if (pilar.subcategorias.some(s => s.toLowerCase() === sub.toLowerCase())) {
                    showToast('Esta subcategoría ya existe', 'error');
                    return;
                }

                const updatedCats = {
                    ...currentCats,
                    [selectedPilar]: {
                        ...pilar,
                        subcategorias: [...pilar.subcategorias, sub]
                    }
                };
                setProfile(prev => ({ ...prev, categories: updatedCats }));
                setNewSubcategory('');
                showToast(`"${sub}" agregada a ${pilar.nombre}`);
            };

            const handleRemoveSubcategory = (sub) => {
                const currentCats = profile.categories || PILARES;
                const updatedCats = {
                    ...currentCats,
                    [selectedPilar]: {
                        ...currentCats[selectedPilar],
                        subcategorias: currentCats[selectedPilar].subcategorias.filter(s => s !== sub)
                    }
                };
                setProfile(prev => ({ ...prev, categories: updatedCats }));
            };

            const handleSaveInfo = () => {
                setProfile(prev => ({ ...prev, ...tempInfo }));
                setIsEditingInfo(false);
                showToast('Información perfil actualizada');
            };

            return (
                <div className="space-y-8 animate-fade">
                    <div className="flex justify-between items-center mb-6">
                        <div className="flex items-center gap-4">
                            <div className="w-12 h-12 rounded-2xl flex items-center justify-center text-2xl bg-white/5 border border-white/10">👤</div>
                            <div>
                                <h2 className="text-2xl font-black tracking-tight text-white">Mi Perfil</h2>
                                <p className="text-xs text-white/30 font-medium">{user.email}</p>
                            </div>
                        </div>
                        <button onClick={onLogout} className="text-rose-400 hover:bg-rose-400/10 p-3 rounded-xl transition-all flex items-center gap-2 font-bold text-xs uppercase tracking-widest">
                            <Icons.LogOut /> Cerrar Sesión
                        </button>
                    </div>

                    {/* FRASE DEL DIA */}
                    <div className="glass p-6 rounded-[2rem] border border-white/10 bg-gradient-to-br from-indigo-600/10 to-transparent">
                        <div className="flex items-center gap-4">
                            <span className="text-3xl">✨</span>
                            <div>
                                <p className="text-[10px] uppercase text-indigo-400 font-bold tracking-widest mb-1">Inspiración del día</p>
                                <p className="text-sm font-medium italic text-white/80">"{quote}"</p>
                            </div>
                        </div>
                    </div>


                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                        {/* PERFORMANCE CARDS */}
                        <div className="glass p-6 rounded-[2rem] border border-white/10">
                            <p className="text-[10px] uppercase text-white/40 font-bold mb-3">Rendimiento Ahorro</p>
                            <div className="flex items-end justify-between">
                                <p className="text-2xl font-black">{formatARS(totals.ahorro + totals.inversiones)}</p>
                                <span className={`text-xs font-bold px-2 py-1 rounded-lg ${comparisonData.ahorroPct >= 0 ? 'text-emerald-400 bg-emerald-400/10' : 'text-rose-400 bg-rose-400/10'}`}>
                                    {comparisonData.ahorroPct >= 0 ? '↑' : '↓'} {Math.abs(comparisonData.ahorroPct).toFixed(1)}%
                                </span>
                            </div>
                        </div>

                        <div className="glass p-6 rounded-[2rem] border border-white/10">
                            <p className="text-[10px] uppercase text-white/40 font-bold mb-3">Eficiencia Gastos</p>
                            <div className="flex items-end justify-between">
                                <p className="text-2xl font-black">{formatARS(totals.gastos)}</p>
                                <span className={`text-xs font-bold px-2 py-1 rounded-lg ${comparisonData.gastosPct <= 0 ? 'text-emerald-400 bg-emerald-400/10' : 'text-rose-400 bg-rose-400/10'}`}>
                                    {comparisonData.gastosPct <= 0 ? '↑' : '↓'} {Math.abs(comparisonData.gastosPct).toFixed(1)}%
                                </span>
                            </div>
                        </div>

                        <div className="glass p-6 rounded-[2rem] border border-white/10">
                            <p className="text-[10px] uppercase text-white/40 font-bold mb-3">Estado Financiero</p>
                            <div className="flex items-center gap-3">
                                <div className={`w-3 h-3 rounded-full ${totals.balance >= 0 ? 'bg-emerald-400 shadow-[0_0_10px_rgba(52,211,153,0.5)]' : 'bg-rose-400 shadow-[0_0_10px_rgba(251,113,133,0.5)]'}`}></div>
                                <p className="text-sm font-bold">{totals.balance >= 0 ? 'Saludable' : 'En riesgo'}</p>
                            </div>
                            <p className="text-[10px] text-white/30 mt-2">{insights[0]?.text || "Sigue registrando para más insights."}</p>
                        </div>
                    </div>

                    {/* ESTADO DE SINCRONIZACIÓN REAL (Informativo) */}
                    <div className="glass p-6 rounded-[2rem] border border-white/5 bg-white/5">
                        <div className="flex justify-between items-center mb-4">
                            <div>
                                <h3 className="text-xs font-black uppercase tracking-widest text-indigo-400">Nube ARS Pro</h3>
                                <p className="text-[9px] text-white/30 uppercase mt-1">ID: {user?.uid}</p>
                            </div>
                            <div className="px-2 py-1 rounded-lg text-[9px] font-black uppercase tracking-widest bg-emerald-500/10 text-emerald-400 flex items-center gap-1">
                                <span className="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> Sincronizado
                            </div>
                        </div>

                        <div className="grid grid-cols-2 gap-3 mb-4">
                            <div className="p-3 rounded-xl bg-black/20 border border-white/5">
                                <p className="text-[8px] text-white/20 uppercase font-black mb-1">Registros en Nube</p>
                                <p className="text-xs font-bold">{syncInfo.cloudCount} Movs</p>
                            </div>
                            <div className="p-3 rounded-xl bg-black/20 border border-white/5">
                                <p className="text-[8px] text-white/20 uppercase font-black mb-1">Backup</p>
                                <p className="text-xs font-bold text-indigo-400">En tiempo real</p>
                            </div>
                        </div>
                        <div className="flex flex-col gap-2">
                            <p className="text-[8px] text-white/20 text-center uppercase tracking-tighter italic mb-2">Tus datos se guardan instantáneamente al detectar cambios.</p>
                            <button
                                onClick={onDeleteAccount}
                                className="w-full py-3 bg-rose-500/10 hover:bg-rose-500/20 border border-rose-500/20 rounded-xl text-[9px] font-black uppercase text-rose-400 tracking-widest transition-all"
                            >
                                🗑️ Eliminar mi cuenta y datos
                            </button>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        {/* DATOS PERSONALES / EMPRESA */}
                        <div className="glass p-8 rounded-[2.5rem] border border-white/10">
                            <div className="flex justify-between items-center mb-6">
                                <h3 className="text-xs uppercase text-indigo-400 font-black tracking-widest">Datos para Facturas</h3>
                                {!isEditingInfo && (
                                    <button onClick={() => { setTempInfo({ nombre: profile.nombre || '', cuil: profile.cuil || '' }); setIsEditingInfo(true); }} className="text-[10px] text-white/40 hover:text-white underline font-bold uppercase">Editar</button>
                                )}
                            </div>

                            {isEditingInfo ? (
                                <div className="space-y-4 animate-fade">
                                    <div>
                                        <label className="text-[9px] uppercase text-white/40 font-bold block mb-2 px-1">Nombre / Razón Social</label>
                                        <input type="text" value={tempInfo.nombre} onChange={e => setTempInfo({ ...tempInfo, nombre: e.target.value })} onKeyDown={e => e.key === 'Enter' && handleSaveInfo()} className="w-full p-4 bg-white/5 border border-white/10 rounded-2xl outline-none focus:border-indigo-500 transition-all font-medium text-sm" />
                                    </div>
                                    <div>
                                        <label className="text-[9px] uppercase text-white/40 font-bold block mb-2 px-1">CUIL / CUIT</label>
                                        <input type="text" value={tempInfo.cuil} onChange={e => setTempInfo({ ...tempInfo, cuil: e.target.value })} onKeyDown={e => e.key === 'Enter' && handleSaveInfo()} className="w-full p-4 bg-white/5 border border-white/10 rounded-2xl outline-none focus:border-indigo-500 transition-all font-medium text-sm" />
                                    </div>
                                    <div className="flex gap-3 mt-6">
                                        <button onClick={() => setIsEditingInfo(false)} className="flex-1 py-3 rounded-xl border border-white/10 text-xs font-bold hover:bg-white/5 transition-all">Cancelar</button>
                                        <button onClick={handleSaveInfo} className="flex-1 py-3 rounded-xl bg-indigo-600 text-xs font-bold hover:bg-indigo-700 transition-all">Guardar</button>
                                    </div>
                                </div>
                            ) : (
                                <div className="space-y-6">
                                    <div className="bg-white/5 p-4 rounded-2xl border border-white/5">
                                        <p className="text-[9px] uppercase text-white/30 font-bold mb-1">Nombre / Razón Social</p>
                                        <p className="text-lg font-black">{profile.nombre || 'No configurado'}</p>
                                    </div>
                                    <div className="bg-white/5 p-4 rounded-2xl border border-white/5">
                                        <p className="text-[9px] uppercase text-white/30 font-bold mb-1">CUIL / CUIT</p>
                                        <p className="text-lg font-black font-mono">{profile.cuil || 'No configurado'}</p>
                                    </div>
                                </div>
                            )}
                        </div>

                        {/* TIENDAS FRECUENTES */}
                        <div className="glass p-8 rounded-[2.5rem] border border-white/10 flex flex-col">
                            <h3 className="text-xs uppercase text-indigo-400 font-black tracking-widest mb-6">Tiendas Frecuentes</h3>

                            <div className="flex gap-2 mb-6">
                                <input
                                    type="text"
                                    placeholder="Nueva tienda..."
                                    value={newStore}
                                    onChange={e => setNewStore(e.target.value)}
                                    onKeyDown={e => e.key === 'Enter' && handleAddStore()}
                                    className="flex-1 p-4 bg-white/5 border border-white/10 rounded-2xl outline-none focus:border-indigo-500 transition-all font-medium text-sm"
                                />
                                <button onClick={handleAddStore} className="bg-white/10 hover:bg-indigo-600 p-4 rounded-2xl transition-all active:scale-95 group">
                                    <span className="scale-125 block group-hover:rotate-90 transition-transform"><Icons.Plus /></span>
                                </button>
                            </div>

                            <div className="flex-1 overflow-y-auto max-h-[300px] custom-scroll space-y-2 pr-2">
                                {(!profile.tiendasFrecuentes || profile.tiendasFrecuentes.length === 0) ? (
                                    <p className="text-center py-12 text-white/20 text-xs font-bold tracking-widest uppercase">No hay tiendas favoritas</p>
                                ) : (
                                    profile.tiendasFrecuentes.map((store, i) => (
                                        <div key={i} className="flex justify-between items-center p-4 bg-white/5 hover:bg-white/10 rounded-2xl border border-white/5 transition-all group animate-stagger" style={{ animationDelay: `${i * 50}ms` }}>
                                            <div className="flex items-center gap-3">
                                                <span className="text-indigo-400"><Icons.Store /></span>
                                                <span className="text-sm font-bold">{store}</span>
                                            </div>
                                            <button onClick={() => handleRemoveStore(store)} className="opacity-0 group-hover:opacity-100 p-2 text-white/20 hover:text-rose-400 transition-all">
                                                <Icons.X />
                                            </button>
                                        </div>
                                    ))
                                )}
                            </div>
                        </div>

                        {/* INVERSIONES FRECUENTES */}
                        <div className="glass p-8 rounded-[2.5rem] border border-white/10 flex flex-col">
                            <h3 className="text-xs uppercase text-indigo-400 font-black tracking-widest mb-6">Acciones / Inversiones</h3>

                            <div className="flex gap-2 mb-6">
                                <input
                                    type="text"
                                    placeholder="Nueva inversión (ej: AAPL)..."
                                    value={newInversion}
                                    onChange={e => setNewInversion(e.target.value)}
                                    onKeyDown={e => e.key === 'Enter' && handleAddInversion()}
                                    className="flex-1 p-4 bg-white/5 border border-white/10 rounded-2xl outline-none focus:border-indigo-500 transition-all font-medium text-sm"
                                />
                                <button onClick={handleAddInversion} className="bg-white/10 hover:bg-indigo-600 p-4 rounded-2xl transition-all active:scale-95 group">
                                    <span className="scale-125 block group-hover:rotate-90 transition-transform"><Icons.Plus /></span>
                                </button>
                            </div>

                            <div className="flex-1 overflow-y-auto max-h-[300px] custom-scroll space-y-2 pr-2">
                                {(!profile.inversionesFrecuentes || profile.inversionesFrecuentes.length === 0) ? (
                                    <p className="text-center py-12 text-white/20 text-xs font-bold tracking-widest uppercase">No hay inversiones guardadas</p>
                                ) : (
                                    profile.inversionesFrecuentes.map((inv, i) => (
                                        <div key={i} className="flex justify-between items-center p-4 bg-white/5 hover:bg-white/10 rounded-2xl border border-white/5 transition-all group animate-stagger" style={{ animationDelay: `${i * 50}ms` }}>
                                            <div className="flex items-center gap-3">
                                                <span className="text-indigo-400"><Icons.Trend /></span>
                                                <span className="text-sm font-bold">{inv}</span>
                                            </div>
                                            <button onClick={() => handleRemoveInversion(inv)} className="opacity-0 group-hover:opacity-100 p-2 text-white/20 hover:text-rose-400 transition-all">
                                                <Icons.X />
                                            </button>
                                        </div>
                                    ))
                                )}
                            </div>
                        </div>
                    </div>

                    {/* GESTION DE CATEGORIAS */}
                    <div className="glass p-8 rounded-[2.5rem] border border-white/10">
                        <div className="flex justify-between items-center mb-8">
                            <h3 className="text-xs uppercase text-indigo-400 font-black tracking-widest">Personalizar Categorías</h3>
                            <button onClick={() => setShowPilarCreator(true)} className="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 rounded-xl text-[10px] font-black uppercase tracking-widest transition-all shadow-lg shadow-indigo-600/20">
                                + Nuevo Pilar
                            </button>
                        </div>

                        <div className="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-4 mb-8">
                            {Object.entries(profile.categories || PILARES).map(([key, val]) => (
                                <div key={key} className="relative group">
                                    <button
                                        onClick={() => setSelectedPilar(key)}
                                        className={`w-full p-4 rounded-2xl border transition-all flex flex-col items-center gap-2 ${selectedPilar === key ? 'bg-indigo-600/20 border-indigo-500/50 shadow-[0_0_20px_rgba(79,70,229,0.2)]' : 'bg-white/5 border-white/10 hover:bg-white/10'}`}
                                    >
                                        <span className="text-2xl">{val.icon}</span>
                                        <span className="text-[10px] font-black uppercase tracking-widest">{val.nombre}</span>
                                    </button>
                                    {!['gastos', 'ahorro', 'inversiones', 'ingresos'].includes(key) && (
                                        <button onClick={() => handleRemovePilar(key)} className="absolute -top-1 -right-1 w-6 h-6 bg-rose-500 rounded-full flex items-center justify-center text-white opacity-0 group-hover:opacity-100 transition-all scale-75 hover:scale-100">
                                            <Icons.X />
                                        </button>
                                    )}
                                </div>
                            ))}
                        </div>

                        <div className="bg-white/5 p-6 rounded-[2rem] border border-white/5">
                            <div className="flex flex-col md:flex-row gap-4 mb-6">
                                <input
                                    type="text"
                                    placeholder={`Nueva subcategoría para ${(profile.categories || PILARES)[selectedPilar]?.nombre || ''}...`}
                                    value={newSubcategory}
                                    onChange={e => setNewSubcategory(e.target.value)}
                                    onKeyDown={e => e.key === 'Enter' && handleAddSubcategory()}
                                    className="flex-1 p-4 bg-white/5 border border-white/10 rounded-2xl outline-none focus:border-indigo-500 transition-all font-medium text-sm"
                                />
                                <button onClick={handleAddSubcategory} className="bg-indigo-600 hover:bg-indigo-700 px-8 py-4 rounded-2xl transition-all font-bold text-xs uppercase tracking-widest flex items-center justify-center gap-2">
                                    <Icons.Plus /> Agregar
                                </button>
                            </div>

                            <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
                                {(profile.categories || PILARES)[selectedPilar]?.subcategorias.map((sub, i) => (
                                    <div key={i} className="flex justify-between items-center p-3 bg-white/5 rounded-xl border border-white/5 group hover:bg-white/10 transition-all">
                                        <span className="text-xs font-bold truncate pr-2">{sub}</span>
                                        <button onClick={() => handleRemoveSubcategory(sub)} className="p-1 text-white/20 hover:text-rose-400 transition-all opacity-0 group-hover:opacity-100">
                                            <Icons.X />
                                        </button>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>

                    {/* MODAL CREADOR DE PILARES */}
                    {showPilarCreator && (
                        <div className="fixed inset-0 z-[600] flex items-center justify-center p-4 bg-black/80 backdrop-blur-md animate-fade">
                            <div className="glass p-8 rounded-[2.5rem] max-w-md w-full animate-pop border border-white/10 shadow-2xl">
                                <h3 className="text-xl font-black mb-6 text-center">Nuevo Pilar</h3>
                                <div className="space-y-6">
                                    <div>
                                        <label className="text-[10px] uppercase text-white/40 font-bold block mb-2">Nombre del Pilar</label>
                                        <input type="text" placeholder="Ej: Mascotas" value={newPilar.nombre} onChange={e => setNewPilar({ ...newPilar, nombre: e.target.value })} onKeyDown={e => e.key === 'Enter' && handleAddPilar()} className="w-full p-4 bg-white/5 border border-white/10 rounded-2xl outline-none focus:border-indigo-500 transition-all font-bold" />
                                    </div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="text-[10px] uppercase text-white/40 font-bold block mb-2">Icono (Emoji)</label>
                                            <input type="text" placeholder="🐶" value={newPilar.icon} onChange={e => setNewPilar({ ...newPilar, icon: e.target.value })} onKeyDown={e => e.key === 'Enter' && handleAddPilar()} className="w-full p-4 bg-white/5 border border-white/10 rounded-2xl text-center text-xl outline-none focus:border-indigo-500 transition-all" />
                                        </div>
                                        <div>
                                            <label className="text-[10px] uppercase text-white/40 font-bold block mb-2">Color</label>
                                            <input type="color" value={newPilar.color} onChange={e => setNewPilar({ ...newPilar, color: e.target.value })} className="w-full h-[58px] p-2 bg-white/5 border border-white/10 rounded-2xl cursor-pointer" />
                                        </div>
                                    </div>
                                    <div>
                                        <label className="text-[10px] uppercase text-white/40 font-bold block mb-2">Tipo de Impacto</label>
                                        <select value={newPilar.tipo} onChange={e => setNewPilar({ ...newPilar, tipo: e.target.value })} onKeyDown={e => e.key === 'Enter' && handleAddPilar()} className="w-full p-4 bg-slate-900 border border-white/10 rounded-2xl outline-none focus:border-indigo-500 transition-all font-bold appearance-none cursor-pointer">
                                            <option value="gasto">Gasto</option>
                                            <option value="ingreso">Ingreso</option>
                                            <option value="ahorro">Ahorro</option>
                                            <option value="inversion">Inversión</option>
                                        </select>
                                    </div>
                                    <div className="flex gap-4 mt-4">
                                        <button onClick={() => setShowPilarCreator(false)} className="flex-1 py-4 rounded-2xl border border-white/10 font-bold text-xs uppercase tracking-widest hover:bg-white/5 transition-all">Cancelar</button>
                                        <button onClick={handleAddPilar} className="flex-1 py-4 rounded-2xl bg-indigo-600 text-white font-bold text-xs uppercase tracking-widest hover:bg-indigo-700 transition-all shadow-lg shadow-indigo-600/30">Crear</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // ═══════════════════════════════════════════════════════════════
        // COMPONENTE PRINCIPAL
        // ═══════════════════════════════════════════════════════════════
        const App = () => {
            // Función para obtener las llaves de guardado según el usuario
            const getKeys = (u) => ({
                trans: u ? `finanzas_data_${u.uid}` : 'finanzas_data_anon',
                profile: u ? `finanzas_profile_${u.uid}` : 'finanzas_profile_anon'
            });

            // Perfil por defecto
            const DEFAULT_PROFILE = {
                nombre: '', cuil: '',
                tiendasFrecuentes: [],
                inversionesFrecuentes: [],
                categories: { ...PILARES }
            };

            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);

            // Estado inicial vacío (se cargará al detectar el usuario)
            const [transactions, setTransactions] = useState([]);
            const [profile, setProfile] = useState(DEFAULT_PROFILE);

            const [activeTab, setActiveTab] = useState(() => localStorage.getItem('activeTab') || 'dashboard');
            const [showModal, setShowModal] = useState(false);
            const [editingId, setEditingId] = useState(null);
            const [toast, setToast] = useState(null);
            const [deleteConfirm, setDeleteConfirm] = useState(null);
            const [timeFilter, setTimeFilter] = useState('mes');

            const [formData, setFormData] = useState({
                articulo: '', tienda: '', monto: '', fecha: today(), seccion: 'gastos', subcategoria: 'Alquiler',
                metodoPago: 'efectivo', cuotas: '1', cuotaActual: '1', diaVencimiento: '10'
            });

            const hasSynced = useRef(false);
            const isInitialLoadDone = useRef(false);

            const [showFilterMenu, setShowFilterMenu] = useState(false);
            const [compareMode, setCompareMode] = useState('standard');
            const [periodA, setPeriodA] = useState(new Date().toISOString().slice(0, 7));
            const [periodB, setPeriodB] = useState(() => {
                const d = new Date(); d.setMonth(d.getMonth() - 1);
                return d.toISOString().slice(0, 7);
            });
            const [sessionStartAmount, setSessionStartAmount] = useState(0);
            const [isEditingStartAmount, setIsEditingStartAmount] = useState(false);
            const [tempStartAmount, setTempStartAmount] = useState('0');
            const [syncInfo, setSyncInfo] = useState({
                status: 'sincronizando',
                lastServerUpdate: null,
                isLocal: true,
                cloudCount: 0
            });

            // Lógica de recuperación manual (Force Pull)
            const forcePull = async () => {
                if (!user || user.isAnonymous) return;

                // 1. Verificación básica de internet
                if (!navigator.onLine) {
                    showToast('No tienes conexión a internet', 'error');
                    return;
                }

                setSyncInfo(prev => ({ ...prev, status: 'descargando' }));
                try {
                    // 2. Intentamos obtener del servidor
                    // Quitamos { source: 'server' } si da problemas, o manejamos el error
                    const doc = await db.collection('users').doc(user.uid).get();

                    if (doc.exists) {
                        const data = doc.data();

                        // Verificamos si los datos son frescos
                        const isFromCache = doc.metadata.fromCache;
                        if (isFromCache) {
                            showToast('Aviso: Cargando desde caché (servidor no disponible)', 'info');
                        }

                        if (data.transactions) setTransactions(data.transactions);
                        if (data.profile) setProfile(prev => ({ ...prev, ...data.profile }));

                        showToast(isFromCache ? 'Datos recuperados (Caché)' : 'Datos recuperados de la Nube');

                        setSyncInfo({
                            status: isFromCache ? 'temporal' : 'sincronizado',
                            lastServerUpdate: data.lastUpdate || new Date().toISOString(),
                            isLocal: isFromCache,
                            cloudCount: data.transactions?.length || 0
                        });
                        hasSynced.current = true;
                    } else {
                        showToast('No hay datos en la nube', 'info');
                        setSyncInfo(prev => ({ ...prev, status: 'nuevo' }));
                    }
                } catch (e) {
                    console.error('Error in forcePull:', e);
                    const isOfflineErr = e.message.includes('offline') || e.code === 'unavailable';
                    showToast(isOfflineErr ? 'Firebase está offline. Espera 5s y reintenta.' : 'Error: ' + e.message, 'error');
                    setSyncInfo(prev => ({ ...prev, status: isOfflineErr ? 'offline' : 'error' }));
                }
            };


            // 1. PERSISTENCIA LOCAL (localStorage)
            // Cargar datos cuando el usuario cambia
            useEffect(() => {
                if (!user) return; // Esperar al auth listener

                const keys = getKeys(user);
                const savedTrans = localStorage.getItem(keys.trans);
                const savedProfile = localStorage.getItem(keys.profile);

                if (savedTrans) {
                    try { setTransactions(JSON.parse(savedTrans)); } catch (e) { }
                } else {
                    // MIGRACIÓN: Buscar datos en cualquier llave vieja disponible
                    const legacyKeys = ['finanzas_ars_pro_data', 'finanzas_ars_v1_data', 'finanzas_ars_pro_v1'];
                    for (const lKey of legacyKeys) {
                        const legacy = localStorage.getItem(lKey);
                        if (legacy) {
                            try {
                                const parsed = JSON.parse(legacy);
                                if (Array.isArray(parsed) && parsed.length > 0) {
                                    setTransactions(parsed);
                                    break;
                                }
                            } catch (e) { }
                        }
                    }
                }

                if (savedProfile) {
                    try { setProfile(JSON.parse(savedProfile)); } catch (e) { }
                }

                // Marcamos que la carga inicial local terminó
                isInitialLoadDone.current = true;
            }, [user]);

            // Guardar en localStorage
            useEffect(() => {
                // GUARDIA DE PERSISTENCIA: No guardar si:
                // 1. Aún está cargando
                // 2. No hay usuario
                // 3. NO hemos terminado la carga inicial de local (evita borrar datos en el arranque)
                if (loading || !user || !isInitialLoadDone.current) return;

                const keys = getKeys(user);
                localStorage.setItem(keys.trans, JSON.stringify(transactions));
                localStorage.setItem(keys.profile, JSON.stringify(profile));
                localStorage.setItem('activeTab', activeTab);
            }, [transactions, profile, activeTab, loading, user]);

            // 2. SINCRONIZACIÓN NUBE (Firebase Firestore)
            useEffect(() => {
                if (!user || user.isAnonymous) {
                    hasSynced.current = true;
                    return;
                }

                // A. Escuchar PERFIL
                const unsubProfile = db.collection('usuarios').doc(user.uid).collection('datos').doc('perfil').onSnapshot(
                    (doc) => {
                        if (doc.exists) {
                            const cloudProfile = doc.data();
                            setProfile(prev => ({
                                ...prev,
                                ...cloudProfile,
                                categories: cloudProfile.categories || prev.categories || PILARES
                            }));
                        } else if (!hasSynced.current) {
                            // Si el perfil no existe en la nueva ruta, intentamos migrar del perfil viejo si existe
                            db.collection('users').doc(user.uid).get().then(oldDoc => {
                                if (oldDoc.exists && oldDoc.data().profile) {
                                    console.log('Migrando perfil viejo a nueva estructura...');
                                    db.collection('usuarios').doc(user.uid).collection('datos').doc('perfil').set(oldDoc.data().profile);
                                }
                            });
                        }
                    }
                );

                // B. Escuchar TRANSACCIONES (Subcolección)
                const unsubTrans = db.collection('usuarios').doc(user.uid).collection('transacciones').onSnapshot(
                    (snapshot) => {
                        const cloudTrans = snapshot.docs.map(d => ({ ...d.data(), id: d.id }));

                        // Ordenar por fecha desc por defecto para la consistencia
                        cloudTrans.sort((a, b) => new Date(b.fecha) - new Date(a.fecha));

                        setTransactions(cloudTrans);
                        hasSynced.current = true;

                        setSyncInfo({
                            status: 'sincronizado',
                            lastServerUpdate: new Date().toISOString(),
                            isLocal: false,
                            cloudCount: cloudTrans.length
                        });
                    },
                    (err) => {
                        console.error('Error en onSnapshot Trans:', err);
                        const isOffline = err.message.includes('offline');
                        setSyncInfo({ status: isOffline ? 'offline' : 'error', lastServerUpdate: null, isLocal: true });
                        if (isOffline) showToast('Modo sin conexión', 'info');
                    }
                );

                return () => { unsubProfile(); unsubTrans(); };
            }, [user]);

            // Guardado automático del perfil (Debounced)
            useEffect(() => {
                if (!user || !hasSynced.current) return;
                const t = setTimeout(() => {
                    db.collection('usuarios').doc(user.uid).collection('datos').doc('perfil').set(profile, { merge: true });
                }, 2000);
                return () => clearTimeout(t);
            }, [profile, user]);

            // Auth Listener (Setup once)
            useEffect(() => {
                const unsub = auth.onAuthStateChanged((u) => {
                    // RESET TOTAL: Cada vez que el auth cambie (login o logout)
                    // Limpiamos estados locales para asegurar que onSnapshot sea la única fuente fresca
                    setTransactions([]);
                    setProfile(DEFAULT_PROFILE);
                    hasSynced.current = false;
                    isInitialLoadDone.current = false;
                    setSyncInfo({ status: 'sincronizando', lastServerUpdate: null, isLocal: true, cloudCount: 0 });

                    setUser(u);
                    setLoading(false);
                });
                return () => unsub();
            }, []);

            // ═══════════════════════════════════════════════════════════════
            // FASE 3: LÓGICA CRUD (100% local)
            // ═══════════════════════════════════════════════════════════════
            const showToast = (msg, type = 'success') => { setToast({ msg, type }); setTimeout(() => setToast(null), 3000); };
            const generateId = () => 'ars_' + Math.random().toString(36).substr(2, 9) + '_' + Date.now();

            const resetForm = useCallback(() => {
                const defaultPilar = 'gastos';
                const currentCategories = profile.categories || PILARES;
                setFormData({
                    articulo: '', tienda: '', monto: '', fecha: today(),
                    seccion: defaultPilar,
                    subcategoria: currentCategories[defaultPilar].subcategorias[0] || 'Otros',
                    metodoPago: 'efectivo', cuotas: '1', cuotaActual: '1', diaVencimiento: '10'
                });
                setEditingId(null);
                setShowModal(false);
            }, [profile.categories]);

            const handleSave = async (e) => {
                e.preventDefault();
                if (!formData.articulo || !formData.monto) return;

                const id = editingId || generateId();
                const data = {
                    id,
                    articulo: formData.articulo, tienda: formData.tienda, monto: parseFloat(formData.monto),
                    fecha: formData.fecha, seccion: formData.seccion, subcategoria: formData.subcategoria,
                    metodoPago: formData.metodoPago, tipo: (profile.categories || PILARES)[formData.seccion].tipo,
                    timestamp: new Date().toISOString(),
                    ...(formData.metodoPago !== 'efectivo' && { cuotas: parseInt(formData.cuotas) || 1, cuotaActual: parseInt(formData.cuotaActual) || 1, diaVencimiento: parseInt(formData.diaVencimiento) || 10 })
                };

                // Optimistic UI Update (opcional, onSnapshot actualizará después)
                // setTransactions(prev => editingId ? prev.map(t => t.id === id ? data : t) : [data, ...prev]);

                try {
                    if (user && !user.isAnonymous) {
                        await db.collection('usuarios').doc(user.uid).collection('transacciones').doc(id).set(data);
                    }
                    showToast(editingId ? 'Movimiento actualizado' : 'Movimiento guardado');
                } catch (e) {
                    console.error('Error saving:', e);
                    showToast('Error al guardar en nube', 'error');
                }

                resetForm();
            };

            const handleEdit = (t) => {
                setFormData({
                    articulo: t.articulo, tienda: t.tienda || '', monto: t.monto.toString(),
                    fecha: t.fecha, seccion: t.seccion || 'gastos', subcategoria: t.subcategoria,
                    metodoPago: t.metodoPago || (t.seccion === 'tarjetas' ? 'visa' : 'efectivo'),
                    cuotas: t.cuotas?.toString() || '1', cuotaActual: t.cuotaActual?.toString() || '1', diaVencimiento: t.diaVencimiento?.toString() || '10'
                });
                setEditingId(t.id);
                setShowModal(true);
            };

            const handleDelete = async (id) => {
                try {
                    await db.collection('usuarios').doc(user.uid).collection('transacciones').doc(id).delete();
                    showToast('Movimiento eliminado');
                } catch (e) {
                    showToast('Error al eliminar', 'error');
                }
                setDeleteConfirm(null);
            };

            const handleDeleteAccount = async () => {
                const conf = confirm("⚠️ ¿ESTÁS SEGURO? Esta acción eliminará permanentemente todos tus datos financieros de la nube y tu acceso a la app. Esto NO se puede deshacer.");
                if (!conf) return;

                setLoading(true);
                try {
                    const uid = user.uid;
                    // Borrar transacciones
                    const transSnaps = await db.collection('usuarios').doc(uid).collection('transacciones').get();
                    const batch = db.batch();
                    transSnaps.forEach(doc => batch.delete(doc.ref));
                    await batch.commit();

                    // Borrar perfil
                    await db.collection('usuarios').doc(uid).collection('datos').doc('perfil').delete();

                    // Borrar auth
                    await user.delete();
                    showToast('Cuenta eliminada con éxito');
                } catch (e) {
                    if (e.code === 'auth/requires-recent-login') {
                        alert('Debes haber iniciado sesión hace poco para esta acción. Cierra sesión y vuelve a entrar.');
                    } else {
                        showToast('Error: ' + e.message, 'error');
                    }
                } finally {
                    setLoading(false);
                }
            };

            // ═══════════════════════════════════════════════════════════════
            // FASE 1 & 3: FILTRADO EN MEMORIA Y COMPARATIVAS AVANZADAS
            // ═══════════════════════════════════════════════════════════════
            const comparisonData = useMemo(() => {
                let rangeA = { start: new Date(), end: new Date() };
                let rangeB = { start: new Date(), end: new Date() };
                const now = new Date();
                if (timeFilter === 'mes') {
                    rangeA.start = new Date(now.getFullYear(), now.getMonth(), 1);
                    rangeB.start = new Date(now.getFullYear(), now.getMonth() - 1, 1);
                    rangeB.end = new Date(now.getFullYear(), now.getMonth(), 0, 23, 59, 59);
                } else if (timeFilter === 'semana') {
                    rangeA.start = new Date(new Date().setDate(now.getDate() - 7));
                    rangeB.start = new Date(new Date().setDate(now.getDate() - 14));
                    rangeB.end = new Date(new Date().setDate(now.getDate() - 8));
                    rangeB.end.setHours(23, 59, 59);
                } else if (timeFilter === 'dia') {
                    rangeA.start.setHours(0, 0, 0, 0);
                    rangeB.start.setDate(now.getDate() - 1); rangeB.start.setHours(0, 0, 0, 0);
                    rangeB.end.setDate(now.getDate() - 1); rangeB.end.setHours(23, 59, 59);
                } else if (timeFilter === 'compare_mes') {
                    rangeA.start = new Date(periodA + "-01T00:00:00");
                    rangeB.start = new Date(periodB + "-01T00:00:00");
                    rangeA.end = new Date(rangeA.start.getFullYear(), rangeA.start.getMonth() + 1, 0, 23, 59, 59);
                    rangeB.end = new Date(rangeB.start.getFullYear(), rangeB.start.getMonth() + 1, 0, 23, 59, 59);
                } else if (timeFilter === 'compare_dia') {
                    rangeA.start = new Date(periodA + "T00:00:00");
                    rangeB.start = new Date(periodB + "T00:00:00");
                    rangeA.end = new Date(periodA + "T23:59:59");
                    rangeB.end = new Date(periodB + "T23:59:59");
                }

                const dataA = transactions.filter(t => {
                    const d = new Date(t.fecha);
                    return d >= rangeA.start && d <= (rangeA.end > now && !timeFilter.includes('compare') ? now : rangeA.end || now);
                });
                const dataB = transactions.filter(t => { const d = new Date(t.fecha); return d >= rangeB.start && d <= rangeB.end; });
                const sum = (arr) => arr.reduce((s, t) => s + (t.monto || 0), 0);
                const filterByType = (arr, type) => arr.filter(t => t.tipo === type);
                const curGastos = sum(filterByType(dataA, 'gasto'));
                const prevGastos = sum(filterByType(dataB, 'gasto'));
                const curAhorroInversiones = sum(dataA.filter(t => t.tipo === 'ahorro' || t.tipo === 'inversion'));
                const prevAhorroInversiones = sum(dataB.filter(t => t.tipo === 'ahorro' || t.tipo === 'inversion'));

                const calcPct = (c, p) => p === 0 ? (c > 0 ? 100 : 0) : ((c - p) / p) * 100;

                return {
                    gastosPct: calcPct(curGastos, prevGastos),
                    ahorroPct: calcPct(curAhorroInversiones, prevAhorroInversiones),
                    curGastos, prevGastos,
                    curAhorroInversiones, prevAhorroInversiones,
                    filtered: dataA,
                    labelA: timeFilter.includes('compare') ? periodA : 'Actual',
                    labelB: timeFilter.includes('compare') ? periodB : 'Anterior'
                };
            }, [transactions, timeFilter, periodA, periodB]);

            const filteredByTime = comparisonData.filtered;

            const byPilar = useMemo(() => {
                const currentCats = profile.categories || PILARES;
                const groups = { tarjetas: [] };
                Object.keys(currentCats).forEach(key => groups[key] = []);

                (filteredByTime || []).forEach(t => {
                    let sec = t.seccion;
                    if (groups[sec]) groups[sec].push(t);
                    else if (sec === 'tarjetas') groups.tarjetas.push(t);

                    if (t.metodoPago && t.metodoPago !== 'efectivo') {
                        if (!groups.tarjetas.includes(t)) groups.tarjetas.push(t);
                    }
                });
                return groups;
            }, [filteredByTime, profile.categories]);

            const totals = useMemo(() => {
                const currentCats = profile.categories || PILARES;
                const sum = (arr = []) => arr.reduce((s, t) => s + (t.monto || 0), 0);

                let ingresos = 0, gastos = 0, ahorro = 0, inversiones = 0;

                Object.entries(byPilar).forEach(([key, items]) => {
                    if (key === 'tarjetas') return;
                    const catInfo = currentCats[key];
                    if (!catInfo) return;

                    const m = sum(items);
                    if (catInfo.tipo === 'ingreso') ingresos += m;
                    else if (catInfo.tipo === 'gasto') gastos += m;
                    else if (catInfo.tipo === 'ahorro') ahorro += m;
                    else if (catInfo.tipo === 'inversion') inversiones += m;
                });

                const tarjetas = sum(byPilar.tarjetas);
                return { ingresos, gastos, tarjetas, ahorro, inversiones, balance: ingresos - gastos, patrimonio: ahorro + inversiones };
            }, [byPilar, profile.categories]);

            const alertas = useMemo(() => {
                const hoy = new Date().getDate();
                return (byPilar.tarjetas || []).filter(t => {
                    if (!t.diaVencimiento) return false;
                    const diff = t.diaVencimiento - hoy;
                    return diff >= 0 && diff <= 5;
                });
            }, [byPilar.tarjetas]);

            const pieData = useMemo(() => {
                const currentCats = profile.categories || PILARES;
                const totalsByType = { gasto: 0, ahorro: 0, inversion: 0 };

                Object.entries(byPilar).forEach(([key, items]) => {
                    if (key === 'tarjetas') return;
                    const type = currentCats[key]?.tipo;
                    if (totalsByType.hasOwnProperty(type)) {
                        totalsByType[type] += items.reduce((s, t) => s + (t.monto || 0), 0);
                    }
                });

                return [
                    { name: 'Gastos', value: totalsByType.gasto, color: currentCats.gastos?.color || '#f43f5e' },
                    { name: 'Ahorro', value: totalsByType.ahorro, color: currentCats.ahorro?.color || '#3b82f6' },
                    { name: 'Inversiones', value: totalsByType.inversion, color: currentCats.inversiones?.color || '#06b6d4' }
                ].filter(d => d.value > 0);
            }, [byPilar, profile.categories]);

            const trendData = useMemo(() => {
                const grouped = {};
                (filteredByTime || []).forEach(t => {
                    const key = t.fecha;
                    if (!grouped[key]) grouped[key] = { fecha: key, ingresos: 0, gastos: 0 };
                    if (t.tipo === 'ingreso') grouped[key].ingresos += t.monto;
                    else if (t.tipo === 'gasto') grouped[key].gastos += t.monto;
                });
                return Object.values(grouped).sort((a, b) => (a.fecha || '').localeCompare(b.fecha || ''));
            }, [filteredByTime]);

            const insights = useMemo(() => {
                const msgs = [];
                if (totals.ingresos > 0) {
                    const ratio = (totals.gastos / totals.ingresos) * 100;
                    if (ratio > 90) msgs.push({ type: 'danger', text: `⚠️ Atención: Estás gastando el ${ratio.toFixed(0)}% de tus ingresos.` });
                    else if (ratio < 50) msgs.push({ type: 'success', text: `🎉 Excelente: Solo has utilizado el ${ratio.toFixed(0)}% de tus ingresos.` });
                }
                if (totals.patrimonio > 0) msgs.push({ type: 'info', text: `💎 Patrimonio acumulado: ${formatARS(totals.patrimonio)} en ahorro e inversiones.` });
                if (alertas.length > 0) msgs.push({ type: 'danger', text: `🔔 Tienes ${alertas.length} vencimiento(s) de tarjeta próximo(s).` });
                return msgs.slice(0, 3);
            }, [totals, alertas]);

            const renderList = (items = [], showCuotas = false) => (
                (!items || items.length === 0) ? (
                    <div className="text-center py-12 text-white/30">
                        <p className="text-4xl mb-3">📭</p>
                        <p className="text-sm">Sin movimientos registrados</p>
                    </div>
                ) : (
                    <div className="space-y-3">
                        {[...items].sort((a, b) => (b.fecha || '').localeCompare(a.fecha || '')).map((t, i) => (
                            <div key={t.id} className="glass p-4 rounded-2xl flex justify-between items-center group hover:bg-white/10 transition-all cursor-pointer animate-stagger" style={{ animationDelay: `${i * 50}ms` }} onClick={() => handleEdit(t)}>
                                <div className="flex items-center gap-4">
                                    <div className="w-10 h-10 rounded-xl flex items-center justify-center text-lg" style={{ background: `${((profile.categories || PILARES)[t.seccion] || (profile.categories || PILARES).gastos).color}30` }}>
                                        {t.metodoPago && t.metodoPago !== 'efectivo' ? '💳' : ((profile.categories || PILARES)[t.seccion]?.icon || '📝')}
                                    </div>
                                    <div>
                                        <p className="font-semibold text-sm">{t.articulo}</p>
                                        <p className="text-xs text-white/40">
