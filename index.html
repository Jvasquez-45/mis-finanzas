                const unsubProfile = db.collection('usuarios').doc(user.uid).collection('datos').doc('perfil').onSnapshot(
                    (doc) => {
                        console.log('Snapshot Perfil recibido:', doc.exists ? 'Existe' : 'Nuevo');
                        if (doc.exists) {
                            const cloudProfile = doc.data();
                            setProfile(prev => ({
                                ...prev,
                                ...cloudProfile,
                                categories: cloudProfile.categories || prev.categories || PILARES
                            }));
                        }
                    },
                    (err) => {
                        console.error('🕵️ El permiso falló en esta ruta:', profilePath, err);
                    }
                );

                // B. Escuchar TRANSACCIONES (Subcolección)
                const unsubTrans = db.collection('usuarios').doc(user.uid).collection('transacciones').onSnapshot(
                    (snapshot) => {
                        const cloudTrans = snapshot.docs.map(d => ({ ...d.data(), id: d.id }));
                        console.log(`Snapshot Transacciones: ${cloudTrans.length} movimientos recibidos.`);

                        // 🛡️ GUARDIA DE PERSISTENCIA:
                        // Si es la primera vez que sincronizamos y la nube está vacía,
                        // NO sobreescribimos los datos locales que ya cargamos desde localStorage.
                        if (!hasSynced.current && cloudTrans.length === 0) {
                            console.log('Nube vacía en primer sync. Manteniendo datos locales.');
                        } else {
                            setTransactions(cloudTrans);
                        }

                        hasSynced.current = true;

                        setSyncInfo({
                            status: 'sincronizado',
                            lastServerUpdate: new Date().toISOString(),
                            isLocal: false,
                            cloudCount: cloudTrans.length
                        });

                        // Una vez recibida la primera ráfaga, quitamos el loading
                        setLoading(false);
                    },
                    (err) => {
                        const transPath = `usuarios/${user.uid}/transacciones`;
                        console.error('🕵️ El permiso falló en esta ruta:', transPath, err);
                        const isOffline = err.message.includes('offline') || err.code === 'unavailable';
                        setSyncInfo({ status: isOffline ? 'offline' : 'error', lastServerUpdate: null, isLocal: true });
                        if (isOffline) showToast('Modo sin conexión', 'info');
                        setLoading(false); // Al menos dejamos entrar si hay error
                    }
                );

                return () => { unsubProfile(); unsubTrans(); };
            }, [user]);

            // Guardado automático del perfil (Debounced)
            useEffect(() => {
                if (!user || !hasSynced.current) return;
                const path = `usuarios/${user.uid}/datos/perfil`;
                const t = setTimeout(async () => {
                    try {
                        await db.collection('usuarios').doc(user.uid).collection('datos').doc('perfil').set(profile, { merge: true });
                    } catch (err) {
                        console.error('🕵️ El permiso falló en esta ruta:', path, err);
                    }
                }, 2000);
                return () => clearTimeout(t);
            }, [profile, user]);

            useEffect(() => {
                const unsub = auth.onAuthStateChanged((u) => {
                    // RESET TOTAL: Cada vez que el auth cambie (login o logout)
                    setTransactions([]);
                    setProfile(DEFAULT_PROFILE);
                    hasSynced.current = false;
                    isInitialLoadDone.current = false;
                    setSyncInfo({ status: 'sincronizando', lastServerUpdate: null, isLocal: true, cloudCount: 0 });

                    setUser(u);
                    // IMPORTANTE: Solo ponemos loading(false) si NO hay usuario (o sea, está en login).
                    // Si hay usuario, los snapshots de nube se encargarán de apagar el loading.
                    if (!u) setLoading(false);
                });
                return () => unsub();
            }, []);

            // ═══════════════════════════════════════════════════════════════
            // FASE 3: LÓGICA CRUD (100% local)
            // ═══════════════════════════════════════════════════════════════
            const showToast = (msg, type = 'success') => { setToast({ msg, type }); setTimeout(() => setToast(null), 3000); };
            const generateId = () => 'ars_' + Math.random().toString(36).substr(2, 9) + '_' + Date.now();

            const resetForm = useCallback(() => {
                const defaultPilar = (['gastos', 'ingresos', 'inversiones', 'ahorro'].includes(activeTab)) ? activeTab : 'gastos';
                const currentCategories = profile.categories || PILARES;
                setFormData({
                    articulo: '', tienda: '', monto: '', fecha: today(),
                    seccion: defaultPilar,
                    subcategoria: currentCategories[defaultPilar].subcategorias[0] || 'Otros',
                    metodoPago: 'efectivo', cuotas: '1', cuotaActual: '1', diaVencimiento: '10', moneda: 'ARS',
                    formTab: defaultPilar, plataforma: '', inversionTipo: 'Acciones', fuenteIngreso: 'Sueldo', accionCripto: 'Compra Directa', cryptoTicker: ''
                });
                setEditingId(null);
                setShowModal(false);
            }, [profile.categories, activeTab]);

            const handleSave = async (e) => {
                e.preventDefault();
                if (!formData.articulo || !formData.monto || isSaving) return;

                const id = editingId || generateId();
                const data = {
                    id,
                    articulo: formData.articulo, tienda: formData.tienda, monto: parseFloat(formData.monto),
                    fecha: formData.fecha, seccion: formData.seccion, subcategoria: formData.subcategoria,
                    metodoPago: formData.metodoPago, tipo: (profile.categories || PILARES)[formData.seccion].tipo,
                    moneda: formData.moneda || 'ARS',
                    plataforma: formData.plataforma,
                    inversionTipo: formData.inversionTipo,
                    fuenteIngreso: formData.fuenteIngreso,
                    accionCripto: formData.accionCripto,
                    cryptoTicker: formData.cryptoTicker,
                    timestamp: new Date().toISOString(),
                    ...(formData.metodoPago !== 'efectivo' && { cuotas: parseInt(formData.cuotas) || 1, cuotaActual: parseInt(formData.cuotaActual) || 1, diaVencimiento: parseInt(formData.diaVencimiento) || 10 })
                };

                // 🚀 UPDATE OPTIMISTA: Cerramos modal y avisamos de sync
                console.log('--- Optimistic Update ---');
                setTransactions(prev => {
                    if (editingId) return prev.map(t => t.id === id ? data : t);
                    return [data, ...prev];
                });
                resetForm(); // CERRAMOS MODAL AL INSTANTE
                showToast(editingId ? 'Actualizando nube...' : 'Sincronizando con la nube...', 'info');

                setIsSaving(true);
                const path = `usuarios/${user.uid}/transacciones/${id}`;
                try {
                    if (user && !user.isAnonymous) {
                        console.log('Firestore path:', path);
                        await db.collection('usuarios').doc(user.uid).collection('transacciones').doc(id).set(data);
                        console.log('Confirmado por Firestore');
                        showToast(editingId ? 'Datos actualizados' : 'Datos guardados');
                    }
                } catch (err) {
                    console.error('🕵️ El permiso falló en esta ruta:', path, err);
                    showToast('Error de red: Tus cambios se guardarán luego', 'error');
                } finally {
                    setIsSaving(false);
                }
            };

            const handleEdit = (t) => {
                setFormData({
                    articulo: t.articulo, tienda: t.tienda || '', monto: t.monto.toString(),
                    fecha: t.fecha, seccion: t.seccion || 'gastos', subcategoria: t.subcategoria,
                    metodoPago: t.metodoPago || (t.seccion === 'tarjetas' ? 'visa' : 'efectivo'),
                    cuotas: t.cuotas?.toString() || '1', cuotaActual: t.cuotaActual?.toString() || '1', diaVencimiento: t.diaVencimiento?.toString() || '10',
                    moneda: t.moneda || 'ARS',
                    formTab: t.seccion || 'gastos',
                    plataforma: t.plataforma || '',
                    inversionTipo: t.inversionTipo || 'Acciones',
                    fuenteIngreso: t.fuenteIngreso || 'Sueldo',
                    accionCripto: t.accionCripto || 'Compra Directa',
                    cryptoTicker: t.cryptoTicker || ''
                });
                setEditingId(t.id);
                setShowModal(true);
            };

            const handleDelete = async (id) => {
                try {
                    const path = `usuarios/${user.uid}/transacciones/${id}`;
                    // Esperamos el delete
                    await db.collection('usuarios').doc(user.uid).collection('transacciones').doc(id).delete().catch(err => {
                        console.error('🕵️ El permiso falló en esta ruta:', path, err);
                        throw err;
                    });
                    showToast('Movimiento eliminado');
                    setDeleteConfirm(null); // Cierra el confirm
                    resetForm(); // Por si estaba el menú de edición abierto
                } catch (e) {
                    showToast('Error al eliminar', 'error');
                }
            };

            const handleDeleteAccount = async () => {
                const conf = confirm("⚠️ ¿ESTÁS SEGURO? Esta acción eliminará permanentemente todos tus datos financieros de la nube y tu acceso a la app. Esto NO se puede deshacer.");
                if (!conf) return;

                setLoading(true);
                try {
                    const uid = user.uid;
                    // Borrar transacciones
                    const transPath = `usuarios/${uid}/transacciones`;
                    const transSnaps = await db.collection('usuarios').doc(uid).collection('transacciones').get().catch(err => {
                        console.error('🕵️ El permiso falló en esta ruta:', transPath, err);
                        throw err;
                    });
                    const batch = db.batch();
                    transSnaps.forEach(doc => batch.delete(doc.ref));
                    await batch.commit();

                    // Borrar perfil
                    const profilePath = `usuarios/${uid}/datos/perfil`;
                    await db.collection('usuarios').doc(uid).collection('datos').doc('perfil').delete().catch(err => {
                        console.error('🕵️ El permiso falló en esta ruta:', profilePath, err);
                        throw err;
                    });

                    // Borrar auth
                    await user.delete();
                    showToast('Cuenta eliminada con éxito');
                } catch (e) {
                    if (e.code === 'auth/requires-recent-login') {
                        alert('Debes haber iniciado sesión hace poco para esta acción. Cierra sesión y vuelve a entrar.');
                    } else {
                        showToast('Error: ' + e.message, 'error');
                    }
                } finally {
                    setLoading(false);
                }
            };

            // ═══════════════════════════════════════════════════════════════
            // FASE 1 & 3: FILTRADO EN MEMORIA Y COMPARATIVAS AVANZADAS
            // ═══════════════════════════════════════════════════════════════
            const comparisonData = useMemo(() => {
                let rangeA = { start: new Date(), end: new Date() };
                let rangeB = { start: new Date(), end: new Date() };
                const now = new Date();
                if (timeFilter === 'mes') {
                    rangeA.start = new Date(now.getFullYear(), now.getMonth(), 1);
                    rangeB.start = new Date(now.getFullYear(), now.getMonth() - 1, 1);
                    rangeB.end = new Date(now.getFullYear(), now.getMonth(), 0, 23, 59, 59);
                } else if (timeFilter === 'semana') {
                    rangeA.start = new Date(new Date().setDate(now.getDate() - 7));
                    rangeB.start = new Date(new Date().setDate(now.getDate() - 14));
                    rangeB.end = new Date(new Date().setDate(now.getDate() - 8));
                    rangeB.end.setHours(23, 59, 59);
                } else if (timeFilter === 'dia') {
                    rangeA.start.setHours(0, 0, 0, 0);
                    rangeB.start.setDate(now.getDate() - 1); rangeB.start.setHours(0, 0, 0, 0);
                    rangeB.end.setDate(now.getDate() - 1); rangeB.end.setHours(23, 59, 59);
                } else if (timeFilter === 'compare_mes') {
                    rangeA.start = new Date(periodA + "-01T00:00:00");
                    rangeB.start = new Date(periodB + "-01T00:00:00");
                    rangeA.end = new Date(rangeA.start.getFullYear(), rangeA.start.getMonth() + 1, 0, 23, 59, 59);
                    rangeB.end = new Date(rangeB.start.getFullYear(), rangeB.start.getMonth() + 1, 0, 23, 59, 59);
                } else if (timeFilter === 'compare_dia') {
                    rangeA.start = new Date(periodA + "T00:00:00");
                    rangeB.start = new Date(periodB + "T00:00:00");
                    rangeA.end = new Date(periodA + "T23:59:59");
                    rangeB.end = new Date(periodB + "T23:59:59");
                }

                const dataA = transactions.filter(t => {
                    const d = new Date(t.fecha);
                    return d >= rangeA.start && d <= (rangeA.end > now && !timeFilter.includes('compare') ? now : rangeA.end || now);
                });
                const dataB = transactions.filter(t => { const d = new Date(t.fecha); return d >= rangeB.start && d <= rangeB.end; });
                const sum = (arr) => arr.reduce((s, t) => s + (t.monto || 0), 0);
                const filterByType = (arr, type) => arr.filter(t => t.tipo === type);
                const curGastos = sum(filterByType(dataA, 'gasto'));
                const prevGastos = sum(filterByType(dataB, 'gasto'));
                const curAhorroInversiones = sum(dataA.filter(t => t.tipo === 'ahorro' || t.tipo === 'inversion'));
                const prevAhorroInversiones = sum(dataB.filter(t => t.tipo === 'ahorro' || t.tipo === 'inversion'));

                const calcPct = (c, p) => p === 0 ? (c > 0 ? 100 : 0) : ((c - p) / p) * 100;

                return {
                    gastosPct: calcPct(curGastos, prevGastos),
                    ahorroPct: calcPct(curAhorroInversiones, prevAhorroInversiones),
                    curGastos, prevGastos,
                    curAhorroInversiones, prevAhorroInversiones,
                    filtered: dataA,
                    labelA: timeFilter.includes('compare') ? periodA : 'Actual',
                    labelB: timeFilter.includes('compare') ? periodB : 'Anterior'
                };
            }, [transactions, timeFilter, periodA, periodB]);

            const filteredByTime = comparisonData.filtered;

            const byPilar = useMemo(() => {
                const currentCats = profile.categories || PILARES;
                const groups = { tarjetas: [] };
                Object.keys(currentCats).forEach(key => groups[key] = []);

                (filteredByTime || []).forEach(t => {
                    let sec = t.seccion;
                    if (groups[sec]) groups[sec].push(t);
                    else if (sec === 'tarjetas') groups.tarjetas.push(t);

                    if (t.metodoPago && t.metodoPago !== 'efectivo') {
                        if (!groups.tarjetas.includes(t)) groups.tarjetas.push(t);
                    }
                });
                return groups;
            }, [filteredByTime, profile.categories]);

            const totals = useMemo(() => {
                const currentCats = profile.categories || PILARES;
                const sum = (arr = []) => arr.reduce((s, t) => s + (t.monto || 0), 0);

                let ingresos = 0, gastos = 0, ahorro = 0, inversiones = 0;

                Object.entries(byPilar).forEach(([key, items]) => {
                    if (key === 'tarjetas') return;
                    const catInfo = currentCats[key];
                    if (!catInfo) return;

                    const m = sum(items);
                    if (catInfo.tipo === 'ingreso') ingresos += m;
                    else if (catInfo.tipo === 'gasto') gastos += m;
                    else if (catInfo.tipo === 'ahorro') ahorro += m;
                    else if (catInfo.tipo === 'inversion') inversiones += m;
                });

                const tarjetas = sum(byPilar.tarjetas);
                // Dinero Disponible = Ingresos - Gastos - Ahorro - Inversiones (Liquidez real)
                const balance = ingresos - gastos - ahorro - inversiones;
                return { ingresos, gastos, tarjetas, ahorro, inversiones, balance, patrimonio: ahorro + inversiones };
            }, [byPilar, profile.categories]);

            const alertas = useMemo(() => {
                const hoy = new Date().getDate();
                return (byPilar.tarjetas || []).filter(t => {
                    if (!t.diaVencimiento) return false;
                    const diff = t.diaVencimiento - hoy;
                    return diff >= 0 && diff <= 5;
                });
            }, [byPilar.tarjetas]);

            const pieData = useMemo(() => {
                const currentCats = profile.categories || PILARES;
                const totalsByType = { gasto: 0, ahorro: 0, inversion: 0 };

                Object.entries(byPilar).forEach(([key, items]) => {
                    if (key === 'tarjetas') return;
                    const type = currentCats[key]?.tipo;
                    if (totalsByType.hasOwnProperty(type)) {
                        totalsByType[type] += items.reduce((s, t) => s + (t.monto || 0), 0);
                    }
                });

                return [
                    { name: 'Gastos', value: totalsByType.gasto, color: currentCats.gastos?.color || '#f43f5e' },
                    { name: 'Ahorro', value: totalsByType.ahorro, color: currentCats.ahorro?.color || '#3b82f6' },
                    { name: 'Inversiones', value: totalsByType.inversion, color: currentCats.inversiones?.color || '#06b6d4' }
                ].filter(d => d.value > 0);
            }, [byPilar, profile.categories]);

            const dashboardPieData = useMemo(() => {
                const currentCats = profile.categories || PILARES;
                return [
                    { name: 'Ingresos', value: totals.ingresos, color: '#10b981' },
                    { name: 'Gastos', value: totals.gastos, color: '#f43f5e' },
                    { name: 'Ahorro', value: totals.ahorro, color: '#6366f1' },
                    { name: 'Inversiones', value: totals.inversiones, color: '#3b82f6' }
                ].filter(d => d.value > 0);
            }, [totals]);

            const currencyAnalysis = useMemo(() => {
                const assets = transactions.filter(t => t.tipo === 'ahorro' || t.tipo === 'inversion');
                const distArr = { ARS: 0, USD: 0, CRIPTO: 0 };
                assets.forEach(t => {
                    const m = t.moneda || 'ARS';
                    if (distArr.hasOwnProperty(m)) distArr[m] += (t.monto || 0);
                });
                return [
                    { name: 'Pesos (ARS)', value: distArr.ARS, color: '#3b82f6', icon: '🇦🇷' },
                    { name: 'Dólares (USD)', value: distArr.USD, color: '#10b981', icon: '🇺🇸' },
                    { name: 'Cripto', value: distArr.CRIPTO, color: '#f59e0b', icon: '₿' }
                ].filter(d => d.value > 0);
            }, [transactions]);

            const cryptoAnalysis = useMemo(() => {
                const cryptos = transactions.filter(t => (t.tipo === 'ahorro' || t.tipo === 'inversion') && t.moneda === 'CRIPTO');
                const subs = {};
                cryptos.forEach(t => {
                    const s = t.subcategoria || 'Otros';
                    subs[s] = (subs[s] || 0) + (t.monto || 0);
                });
                return Object.entries(subs).map(([name, value]) => ({ name, value })).sort((a, b) => b.value - a.value);
            }, [transactions]);

            const subcategoriesAnalysis = useMemo(() => {
                const groups = { gasto: {}, ingreso: {}, inversion: {}, ahorro: {} };
                const filteredByTime = comparisonData.filtered || [];

                filteredByTime.forEach(t => {
                    const type = t.tipo;
                    if (groups[type]) {
                        const sub = t.subcategoria || 'Otros';
                        groups[type][sub] = (groups[type][sub] || 0) + (t.monto || 0);
                    }
                });

                const sortAndMap = (obj) => Object.entries(obj)
                    .map(([name, value]) => ({ name, value }))
                    .sort((a, b) => b.value - a.value);

                return {
                    gasto: sortAndMap(groups.gasto),
                    ingreso: sortAndMap(groups.ingreso),
                    inversion: sortAndMap(groups.inversion),
                    ahorro: sortAndMap(groups.ahorro)
                };
            }, [comparisonData.filtered]);

            const savingsMetrics = useMemo(() => {
                const income = totals.ingresos || 0;
                const savings = (totals.ahorro || 0) + (totals.inversiones || 0);
                const ratio = income > 0 ? (savings / income) * 100 : 0;
                return { ratio, totalSavings: savings };
            }, [totals]);

            const trendData = useMemo(() => {
                const grouped = {};
                (filteredByTime || []).forEach(t => {
                    const key = t.fecha;
                    if (!grouped[key]) grouped[key] = { fecha: key, ingresos: 0, gastos: 0 };
                    if (t.tipo === 'ingreso') grouped[key].ingresos += t.monto;
                    else if (t.tipo === 'gasto') grouped[key].gastos += t.monto;
                });
                return Object.values(grouped).sort((a, b) => (a.fecha || '').localeCompare(b.fecha || ''));
            }, [filteredByTime]);

            const insights = useMemo(() => {
                const msgs = [];
                if (totals.ingresos > 0) {
                    const ratio = (totals.gastos / totals.ingresos) * 100;
                    if (ratio > 90) msgs.push({ type: 'danger', text: `⚠️ Atención: Estás gastando el ${ratio.toFixed(0)}% de tus ingresos.` });
                    else if (ratio < 50) msgs.push({ type: 'success', text: `🎉 Excelente: Solo has utilizado el ${ratio.toFixed(0)}% de tus ingresos.` });
                }
                if (totals.patrimonio > 0) msgs.push({ type: 'info', text: `💎 Patrimonio acumulado: ${formatARS(totals.patrimonio)} en ahorro e inversiones.` });
                if (alertas.length > 0) msgs.push({ type: 'danger', text: `🔔 Tienes ${alertas.length} vencimiento(s) de tarjeta próximo(s).` });
                return msgs.slice(0, 3);
            }, [totals, alertas]);

            const renderList = (items = [], showCuotas = false) => (
                (!items || items.length === 0) ? (
                    <div className="text-center py-12 text-gray-100/70 glass rounded-[2.5rem] border-white/5">
                        <p className="text-4xl mb-3">📭</p>
                        <p className="text-sm font-bold uppercase tracking-widest opacity-50">Sin movimientos</p>
                    </div>
                ) : (
                    <div className="space-y-3">
                        {[...items].sort((a, b) => (b.fecha || '').localeCompare(a.fecha || '')).map((t, i) => (
                            <div key={t.id} className="bg-[#121421] p-5 rounded-[2rem] border border-white/10 flex justify-between items-center group hover:bg-[#1a1c2e] transition-all cursor-pointer animate-stagger shadow-xl" style={{ animationDelay: `${i * 50}ms` }} onClick={() => handleEdit(t)}>
                                <div className="flex items-center gap-5">
                                    <div className="w-12 h-12 rounded-2xl flex items-center justify-center text-xl shadow-inner bg-slate-50 border border-black/5">
                                        {t.metodoPago && t.metodoPago !== 'efectivo' ? '💳' : ((profile.categories || PILARES)[t.seccion]?.icon || '📝')}
                                    </div>
                                    <div>
                                        <p className="font-bold text-sm tracking-tight text-white">{t.articulo}</p>
                                        <p className="text-[10px] text-gray-100/70 font-bold uppercase tracking-wider mt-0.5">
                                            {t.tienda ? <span className="text-blue-400">{t.tienda} • </span> : ''}
                                            {t.subcategoria} • {t.fecha}
                                        </p>
                                    </div>
                                </div>
                                <div className="flex items-center gap-5">
                                    <span className={`font-black tracking-tighter text-base ${t.tipo === 'ingreso' ? 'text-emerald-400 text-glow' : t.tipo === 'ahorro' || t.tipo === 'inversion' ? 'text-blue-400 text-glow' : 'text-rose-400'}`}>
                                        {t.tipo === 'ingreso' ? '+' : '-'}{formatARS(t.monto)}
                                    </span>
                                    <button onClick={(e) => { e.stopPropagation(); setDeleteConfirm(t.id); }} className="opacity-0 group-hover:opacity-100 text-white/40 hover:text-rose-500 transition-all p-2"><Icons.Trash /></button>
                                </div>
                            </div>
                        ))}
                    </div>
                )
            );


            // ═══════════════════════════════════════════════════════════════
            // RENDERS
            // ═══════════════════════════════════════════════════════════════
            if (error) return (
                <div className="min-h-screen flex items-center justify-center p-6">
                    <div className="glass p-8 rounded-3xl max-w-md w-full text-center animate-fade">
                        <div className="text-rose-400 mb-4 flex justify-center"><Icons.Alert /></div>
                        <h2 className="text-xl font-bold mb-3">Configuración Requerida</h2>
                        <p className="text-white/60 text-sm mb-6">{error}</p>
                        <button onClick={() => location.reload()} className="w-full bg-blue-600 hover:bg-blue-700 py-4 rounded-2xl font-bold transition-all">Reintentar</button>
                    </div>
                </div>
            );

            if (!user) return <AuthView onLogin={() => { }} />;

            if (loading) return (
                <div className="min-h-screen flex flex-col items-center justify-center p-6 bg-[#0f172a]">
                    <div className="relative">
                        <div className="w-24 h-24 border-4 border-blue-500/20 border-t-blue-500 rounded-full animate-spin"></div>
                        <div className="absolute inset-0 flex items-center justify-center text-2xl">💵</div>
                    </div>
                    <h1 className="mt-8 text-xl font-black tracking-[0.3em] text-white/90 uppercase">ARS Pro</h1>
                    <p className="mt-2 text-[10px] font-bold text-white/40 uppercase tracking-widest animate-pulse">Iniciando sesión segura...</p>
                </div>
            );
            return (
                <div className="min-h-screen pb-32 md:pb-8 md:pl-64 relative overflow-hidden">
                    {/* Fluid Background Blobs */}
                    <div className="bg-fluid">
                        <div className="blob blob-1"></div>
                        <div className="blob blob-2"></div>
                        <div className="blob blob-3"></div>
                    </div>
                    {/* TOAST */}
                    {toast && (
                        <div className={`fixed top-6 right-6 z-50 glass px-6 py-4 rounded-2xl flex items-center gap-3 toast ${toast.type === 'error' ? 'border-rose-500/50 text-rose-300' : 'border-emerald-500/50 text-emerald-300'}`}>
                            {toast.type === 'error' ? <Icons.Alert /> : <Icons.Check />}
                            <span className="font-medium text-sm">{toast.msg}</span>
                        </div>
                    )}

                    {/* DELETE CONFIRM */}
                    {deleteConfirm && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm animate-fade" onClick={() => setDeleteConfirm(null)}>
                            <div className="glass p-8 rounded-3xl max-w-sm w-full text-center animate-pop" onClick={e => e.stopPropagation()}>
                                <p className="text-4xl mb-4">🗑️</p>
                                <h3 className="text-lg font-bold mb-2">¿Eliminar movimiento?</h3>
                                <p className="text-white/50 text-sm mb-6">Esta acción no se puede deshacer.</p>
                                <div className="flex gap-3">
                                    <button onClick={() => setDeleteConfirm(null)} className="flex-1 py-3 rounded-xl border border-white/20 hover:bg-white/10 font-semibold transition-all">Cancelar</button>
                                    <button onClick={() => handleDelete(deleteConfirm)} className="flex-1 py-3 rounded-xl bg-rose-600 hover:bg-rose-700 font-semibold transition-all">Eliminar</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* SIDEBAR DESKTOP */}
                    <nav className="hidden md:flex fixed left-0 top-0 h-screen w-64 glass-dark flex-col p-8 z-40 border-r border-white/5">
                        <div className="flex items-center gap-3 mb-10">
                            <img src="imagen/nivo-logo-blank.png" alt="Nivo Logo" className="w-10 h-10 object-contain drop-shadow-[0_0_10px_rgba(255,255,255,0.3)]" />
                            <h1 className="text-2xl font-black tracking-tighter bg-gradient-to-r from-white to-white/60 bg-clip-text text-transparent">Nivo</h1>
                        </div>
                        <p className="text-[10px] text-gray-100/90 uppercase tracking-widest mb-8">Versión Pro</p>
                        <div className="flex-1 space-y-2">
                            {TABS.map(tab => (
                                <button key={tab.id} onClick={() => setActiveTab(tab.id)} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-left text-sm font-medium transition-all ${activeTab === tab.id ? 'bg-blue-600 text-white' : 'text-white/60 hover:bg-white/10'}`}>
                                    <span>{tab.icon}</span> {tab.nombre}
                                </button>
                            ))}
                        </div>
                        <p className="text-[10px] text-gray-100/70 text-center">UID: {user?.uid?.slice(0, 8)}</p>
                    </nav>

                    {/* HEADER MOBILE */}
                    <header className="md:hidden glass-dark p-5 sticky top-0 z-30">
                        <div className="flex justify-between items-center">
                            <div className="flex items-center gap-2">
                                <img src="imagen/logo-NIVO-celular.png" alt="Nivo Logo" className="w-7 h-7 object-contain" />
                                <h1 className="text-lg font-bold">Nivo Pro</h1>
                            </div>
                        </div>
                    </header>

                    {/* CONTENIDO PRINCIPAL */}
                    <main className="max-w-4xl mx-auto p-4 md:p-8 space-y-6 animate-fade">
                        {/* ALERTAS DE VENCIMIENTO */}
                        {alertas.length > 0 && activeTab === 'dashboard' && (
                            <div className="glass border-amber-500/50 p-5 rounded-2xl flex items-start gap-4 animate-slide">
                                <div className="text-amber-400"><Icons.Alert /></div>
                                <div>
                                    <p className="font-bold text-sm text-amber-300">Vencimientos Próximos</p>
                                    <p className="text-xs text-white/60 mt-1">{alertas.map(a => `${a.articulo} (día ${a.diaVencimiento})`).join(', ')}</p>
                                </div>
                            </div>
                        )}

                        {/* FILTRO PREMIUM REDISEÑADO */}
                        <div className="relative group/filter">
                            <button onClick={() => setShowFilterMenu(!showFilterMenu)} className="bg-[#1a1c2e] px-5 py-3 rounded-2xl text-xs font-extrabold flex items-center gap-3 hover:bg-[#252845] transition-all border border-white/10 shadow-[0_8px_30px_rgb(0,0,0,0.5)] active:scale-95">
                                <span className="text-blue-400 scale-110"><Icons.Filter /></span>
                                <span className="text-white tracking-wide">
                                    {timeFilter === 'compare_mes' ? `Comparar Meses` : timeFilter === 'compare_dia' ? `Comparar Días` : `Ver: ${timeFilter === 'dia' ? 'Hoy' : timeFilter === 'semana' ? 'Esta Semana' : 'Este Mes'}`}
                                </span>
                                <span className="text-gray-100/90 transition-transform duration-500" style={{ transform: showFilterMenu ? 'rotate(180deg)' : 'rotate(0deg)' }}><Icons.ChevronDown /></span>
                            </button>

                            {showFilterMenu && (
                                <>
                                    <div className="fixed inset-0 z-[100]" onClick={() => setShowFilterMenu(false)}></div>
                                    <div className="absolute top-14 left-0 w-80 bg-[#121421] border border-white/10 rounded-3xl p-3 shadow-[0_20px_50px_rgba(0,0,0,0.8)] z-[101] animate-pop origin-top-left ring-1 ring-white/5 backdrop-blur-xl">
                                        <div className="px-4 py-4 border-b border-white/5 mb-2">
                                            <p className="text-[10px] uppercase text-blue-400 font-black tracking-[0.2em]">Configurar Dashboard</p>
                                        </div>

                                        <div className="space-y-1">
                                            <p className="px-4 py-2 text-[9px] uppercase text-white/40 font-bold tracking-widest">Filtros Rápidos</p>
                                            {[
                                                { id: 'dia', label: 'Hoy vs Ayer', desc: 'Vista diaria rápida', icon: '☀️' },
                                                { id: 'semana', label: 'Semana vs Pasada', desc: 'Ciclo de 7 días', icon: '📆' },
                                                { id: 'mes', label: 'Mes Actual vs Anterior', desc: 'Resumen mensual', icon: '📅' }
                                            ].map(opt => (
                                                <button key={opt.id} onClick={() => { setTimeFilter(opt.id); setShowFilterMenu(false); }} className={`w-full flex items-center gap-4 px-4 py-3 rounded-2xl text-left transition-all ${timeFilter === opt.id ? 'bg-blue-600/20 ring-1 ring-blue-500/50' : 'hover:bg-white/5'}`}>
                                                    <span className="text-xl">{opt.icon}</span>
                                                    <div>
                                                        <p className={`text-xs font-bold ${timeFilter === opt.id ? 'text-white' : 'text-white/60'}`}>{opt.label}</p>
                                                        <p className="text-[9px] text-gray-100/70 font-medium">{opt.desc}</p>
                                                    </div>
                                                </button>
                                            ))}

                                            <p className="px-4 py-2 mt-4 text-[9px] uppercase text-white/40 font-bold tracking-widest">Comparativa Personalizada</p>

                                            {/* MODO COMPARAR MESES */}
                                            <div className={`p-4 rounded-2xl transition-all ${timeFilter === 'compare_mes' ? 'bg-purple-600/10 ring-1 ring-purple-500/30' : 'hover:bg-white/5'}`}>
                                                <button onClick={() => setTimeFilter('compare_mes')} className="flex items-center gap-4 w-full text-left mb-3">
                                                    <span className="text-xl">📊</span>
                                                    <p className="text-xs font-bold text-white/60">Comparar dos Meses</p>
                                                </button>
                                                {timeFilter === 'compare_mes' && (
                                                    <div className="grid grid-cols-2 gap-2 animate-fade">
                                                        <input type="month" value={periodA} onChange={e => setPeriodA(e.target.value)} className="bg-white/5 border border-white/10 p-2 rounded-lg text-[10px] text-white focus:border-blue-500 outline-none" />
                                                        <input type="month" value={periodB} onChange={e => setPeriodB(e.target.value)} className="bg-white/5 border border-white/10 p-2 rounded-lg text-[10px] text-white focus:border-blue-500 outline-none" />
                                                    </div>
                                                )}
                                            </div>

                                            {/* MODO COMPARAR DÍAS */}
                                            <div className={`p-4 rounded-2xl transition-all ${timeFilter === 'compare_dia' ? 'bg-amber-600/10 ring-1 ring-amber-500/30' : 'hover:bg-white/5'}`}>
                                                <button onClick={() => setTimeFilter('compare_dia')} className="flex items-center gap-4 w-full text-left mb-3">
                                                    <span className="text-xl">⚖️</span>
                                                    <p className="text-xs font-bold text-white/60">Comparar dos Días</p>
                                                </button>
                                                {timeFilter === 'compare_dia' && (
                                                    <div className="grid grid-cols-2 gap-2 animate-fade">
                                                        <input type="date" value={periodA} onChange={e => setPeriodA(e.target.value)} className="bg-white/5 border border-white/10 p-2 rounded-lg text-[10px] text-white focus:border-blue-500 outline-none" />
                                                        <input type="date" value={periodB} onChange={e => setPeriodB(e.target.value)} className="bg-white/5 border border-white/10 p-2 rounded-lg text-[10px] text-white focus:border-blue-500 outline-none" />
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    </div>
                                </>
                            )}
                        </div>

                        {/* DASHBOARD PREMIUM */}
                        {activeTab === 'dashboard' && (
                            <div className="space-y-8 animate-fade">
                                {/* COACH DE FINANZAS */}
                                <CoachFinanciero
                                    transactions={transactions}
                                    totals={totals}
                                    profile={profile}
                                />

                                {/* HERO SECTION: BALANCE TOTAL */}
                                <div className="glass p-8 rounded-[2.5rem] relative overflow-hidden group">
                                    <div className="absolute top-0 right-0 p-12 opacity-5 scale-150 rotate-12">
                                        <div className="text-blue-500 w-32 h-32"><Icons.Trend /></div>
                                    </div>
                                    <div className="relative z-10 flex flex-col md:flex-row md:items-center justify-between gap-8">
                                        <div>
                                            <p className="text-[10px] uppercase text-blue-400 font-extrabold tracking-[0.2em] mb-3">Dinero Total Disponible</p>
                                            <h2 className="text-5xl font-black text-white tracking-tighter mb-2 drop-shadow-sm">
                                                {formatARS(totals.balance)}
                                            </h2>
                                            <div className="flex items-center gap-3">
                                                <span className="text-[10px] text-gray-100/90 font-bold uppercase tracking-widest">Variación Total</span>
                                                <span className={`px-2 py-0.5 rounded-lg text-[10px] font-black ${totals.balance >= 0 ? 'bg-emerald-500/20 text-emerald-400' : 'bg-rose-500/20 text-rose-400'}`}>
                                                    {totals.balance >= 0 ? '↗' : '↘'} {formatARS(Math.abs(totals.balance))}
                                                </span>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                {/* GRID SUPERIOR (BENTO) */}
                                <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                                    <div className="md:col-span-2 glass p-6 rounded-[2.5rem] border-white/5 relative overflow-hidden group">
                                        <div className="relative z-10">
                                            <p className="text-[10px] uppercase text-gray-100/90 font-bold tracking-[0.2em] mb-4">Gasto Total Período</p>
                                            <div className="flex items-end gap-3">
                                                <h2 className="text-4xl font-black tracking-tight text-white">{formatARS(totals.gastos)}</h2>
                                                {comparisonData.prevGastos > 0 && (
                                                    <div className={`mb-1.5 flex items-center gap-1 px-2 py-0.5 rounded-lg text-[10px] font-bold ${comparisonData.gastosPct <= 0 ? 'bg-emerald-500/20 text-emerald-400' : 'bg-rose-500/20 text-rose-400'}`}>
                                                        {comparisonData.gastosPct <= 0 ? '↘' : '↗'} {Math.abs(comparisonData.gastosPct).toFixed(0)}%
                                                    </div>
                                                )}
                                            </div>
                                            <p className="text-xs text-gray-100/70 mt-2">vs. {comparisonData.labelB} ({formatARS(comparisonData.prevGastos)})</p>
                                        </div>
                                    </div>

                                    <div className="glass p-6 rounded-[2rem] border-white/5 relative overflow-hidden group">
                                        <div>
                                            <p className="text-[10px] uppercase font-black tracking-widest text-gray-100/90 mb-1">Balance</p>
                                            <h3 className={`text-2xl font-black ${totals.balance >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>
                                                {formatARS(totals.balance)}
                                            </h3>
                                        </div>
                                    </div>

                                    <div className="glass p-6 rounded-[2rem] border-white/5 relative overflow-hidden group">
                                        <div>
                                            <p className="text-[10px] uppercase font-black tracking-widest text-gray-100/90 mb-1">Inversiones</p>
                                            <h3 className="text-2xl font-black text-cyan-400">
                                                {formatARS(totals.patrimonio)}
                                            </h3>
                                        </div>
                                    </div>
                                </div>

                                {/* FILA MEDIA: GRÁFICO CIRCULAR + MIS TARJETAS */}
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                    <div className="md:col-span-1 glass p-6 rounded-3xl flex flex-col items-center">
                                        <h3 className="text-xs uppercase text-gray-100/90 font-bold tracking-wider mb-6 w-full">Distribución General</h3>
                                        <div className="relative w-full aspect-square max-w-[200px]">
                                            <ResponsiveContainer width="100%" height="100%">
                                                <PieChart>
                                                    <Pie data={dashboardPieData} cx="50%" cy="50%" innerRadius={65} outerRadius={85} paddingAngle={8} dataKey="value" stroke="none">
                                                        {dashboardPieData.map((entry, i) => <Cell key={i} fill={entry.color} cornerRadius={10} />)}
                                                    </Pie>
                                                    <Tooltip
                                                        formatter={(v) => formatARS(v)}
                                                        contentStyle={{ background: '#111421', border: 'none', borderRadius: '15px', boxShadow: '0 10px 30px rgba(0,0,0,0.5)' }}
                                                        itemStyle={{ color: '#fff', fontWeight: 'bold' }}
                                                        cursor={{ fill: 'transparent' }}
                                                    />
                                                </PieChart>
                                            </ResponsiveContainer>
                                            <div className="absolute inset-0 flex flex-col items-center justify-center pointer-events-none">
                                                <p className="text-[10px] text-gray-100/70 uppercase font-bold tracking-tighter">Total Período</p>
                                                <p className="text-lg font-black tracking-tight">{formatARS(dashboardPieData.reduce((s, d) => s + d.value, 0)).replace('$', '').split(',')[0]}</p>
                                            </div>
                                        </div>
                                        <div className="mt-6 w-full space-y-2">
                                            {dashboardPieData.map((d, i) => (
                                                <div key={i} className="flex justify-between items-center text-[10px]">
                                                    <span className="flex items-center gap-2 text-white/50"><div className="w-2 h-2 rounded-full" style={{ background: d.color }}></div> {d.name}</span>
                                                    <span className="font-bold">{formatARS(d.value)}</span>
                                                </div>
                                            ))}
                                        </div>
                                    </div>

                                    <div className="md:col-span-2 space-y-6">
                                        {/* TARJETAS VISUALES */}
                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                            {MEDIOS_PAGO.filter(m => m.id === 'visa' || m.id === 'mastercard').map(card => {
                                                const cardDebt = byPilar.tarjetas.filter(t => t.metodoPago === card.id).reduce((s, t) => s + t.monto, 0);
                                                return (
                                                    <div key={card.id} className="relative h-40 rounded-2xl p-5 overflow-hidden group border border-white/10 shadow-2xl" style={{ background: card.id === 'visa' ? 'linear-gradient(135deg, #1e1b4b 0%, #312e81 100%)' : 'linear-gradient(135deg, #4c1d95 0%, #6d28d9 100%)' }}>
                                                        <div className="absolute -top-10 -right-10 w-32 h-32 bg-white/5 rounded-full blur-2xl group-hover:scale-150 transition-transform duration-1000"></div>
                                                        <div className="relative z-10 h-full flex flex-col justify-between">
                                                            <div className="flex justify-between items-start">
                                                                <span className="text-xl">{card.icon}</span>
                                                                <span className="text-[10px] font-bold tracking-widest text-gray-100/90 uppercase">{card.nombre}</span>
                                                            </div>
                                                            <div>
                                                                <p className="text-[10px] text-gray-100/90 mb-1">Deuda Acumulada</p>
                                                                <p className="text-2xl font-bold tracking-tight">{formatARS(cardDebt)}</p>
                                                            </div>
                                                            <div className="flex justify-between items-center">
                                                                <p className="text-[8px] font-mono tracking-widest text-white/40">**** **** **** 1234</p>
                                                                <div className="w-8 h-5 bg-white/20 rounded-md backdrop-blur-md border border-white/10"></div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>

                                        {/* ÚLTIMOS MOVIMIENTOS DASHBOARD */}
                                        <div className="glass p-6 rounded-3xl">
                                            <div className="flex justify-between items-center mb-4">
                                                <h3 className="text-xs uppercase text-gray-100/90 font-bold tracking-wider">Últimos Movimientos</h3>
                                                <button onClick={() => setActiveTab('gastos')} className="text-[10px] text-blue-400 font-bold hover:underline">Ver todos</button>
                                            </div>
                                            {renderList(filteredByTime.slice(0, 4))}
                                        </div>
                                    </div>
                                </div>

                                {/* FILA INFERIOR: GRÁFICO DE TENDENCIA */}
                                <div className="glass p-6 rounded-3xl">
                                    <h3 className="text-xs uppercase text-gray-100/90 font-bold tracking-wider mb-6">Tendencia de Gastos</h3>
                                    <div className="h-[250px] w-full">
                                        <ResponsiveContainer width="100%" height="100%">
                                            <AreaChart data={trendData}>
                                                <defs>
                                                    <linearGradient id="colorWave" x1="0" y1="0" x2="0" y2="1">
                                                        <stop offset="5%" stopColor="#6366f1" stopOpacity={0.3} />
                                                        <stop offset="95%" stopColor="#6366f1" stopOpacity={0} />
                                                    </linearGradient>
                                                </defs>
                                                <XAxis dataKey="fecha" hide />
                                                <YAxis hide />
                                                <Tooltip
                                                    formatter={(v) => formatARS(v)}
                                                    contentStyle={{ background: '#111421', border: 'none', borderRadius: '15px' }}
                                                    itemStyle={{ color: '#fff', fontWeight: 'bold' }}
                                                />
                                                <Area type="monotone" dataKey="gastos" stroke="#6366f1" strokeWidth={3} fillOpacity={1} fill="url(#colorWave)" />
                                            </AreaChart>
                                        </ResponsiveContainer>
                                    </div>
                                </div>
                            </div>
                        )
                        }

                        {/* SECCIONES ESPECÍFICAS CON DASHBOARD INTERNO */}
                        {
                            ['gastos', 'ahorro', 'inversiones', 'ingresos'].includes(activeTab) && (
                                <div className="space-y-8 animate-fade">
                                    <div className="flex justify-between items-center mb-6">
                                        <div className="flex items-center gap-4">
                                            <div className="w-12 h-12 rounded-2xl flex items-center justify-center text-2xl bg-white/5 border border-white/10">
                                                {PILARES[activeTab].icon}
                                            </div>
                                            <div>
                                                <h2 className="text-2xl font-black tracking-tight text-white">{PILARES[activeTab].nombre}</h2>
                                                <p className="text-xs text-gray-100/70 font-medium">Gestión detallada de {PILARES[activeTab].nombre.toLowerCase()}</p>
                                            </div>
                                        </div>
                                        <button onClick={() => { resetForm(); setFormData({ ...formData, seccion: activeTab }); setShowModal(true); }} className="bg-blue-600 hover:bg-blue-700 px-6 py-3 rounded-2xl font-black text-xs transition-all flex items-center gap-3 shadow-lg shadow-blue-600/20 active:scale-95">
                                            <span className="text-lg">+</span> Nuevo Registro
                                        </button>
                                    </div>
                                    {(() => {
                                        const items = byPilar[activeTab] || [];
                                        const total = items.reduce((s, t) => s + (t.monto || 0), 0);
                                        const subDist = {};
                                        items.forEach(t => { subDist[t.subcategoria] = (subDist[t.subcategoria] || 0) + (t.monto || 0); });
                                        const pieSubData = Object.entries(subDist).map(([name, value]) => ({ name, value })).sort((a, b) => b.value - a.value);
                                        const colors = ['#818cf8', '#6366f1', '#4338ca', '#3730a3', '#312e81', '#1e1b4b'];
                                        return (
                                            <>
                                                {activeTab === 'ahorro' && (
                                                    <div className="mb-0 animate-slide">
                                                        <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6">
                                                            <div className="flex items-center gap-2">
                                                                <span className="text-blue-400 font-bold"><Icons.Safe /></span>
                                                                <h3 className="text-xs uppercase font-black tracking-[0.2em] text-white">Mis Alcancías (Buckets)</h3>
                                                            </div>
                                                            <div className="flex gap-2 overflow-x-auto no-scrollbar pb-2">
                                                                {currencyAnalysis.map((c, i) => (
                                                                    <div key={i} className="flex items-center gap-2 bg-white/5 px-4 py-2 rounded-full border border-white/10 whitespace-nowrap">
                                                                        <span className="text-sm">{c.icon}</span>
                                                                        <span className="text-[10px] font-black">{formatARS(c.value)}</span>
                                                                    </div>
                                                                ))}
                                                            </div>
                                                        </div>
                                                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                                            {(profile.categories || PILARES).ahorro.subcategorias.map((sub, i) => {
                                                                const subTotal = items.filter(t => t.subcategoria === sub).reduce((s, t) => s + (t.monto || 0), 0);
                                                                const meta = (profile.categories || PILARES).ahorro.metas?.[sub] || 0;
                                                                const progreso = meta > 0 ? Math.min(100, (subTotal / meta) * 100) : 0;

                                                                return (
                                                                    <div key={i} className="bg-[#1a1c2e] p-6 rounded-[2.5rem] border border-white/5 relative overflow-hidden group shadow-xl">
                                                                        <div className="absolute top-0 right-0 p-6 opacity-10 group-hover:scale-110 transition-transform">
                                                                            <span className="text-4xl">💰</span>
                                                                        </div>
                                                                        <div className="relative z-10 h-full flex flex-col">
                                                                            <p className="text-[10px] uppercase font-black tracking-widest text-blue-400 mb-1">{sub}</p>
                                                                            <h4 className="text-2xl font-black text-white mb-4">{formatARS(subTotal)}</h4>

                                                                            <div className="flex-1">
                                                                                {meta > 0 && (
                                                                                    <div className="space-y-2 mb-6">
                                                                                        <div className="flex justify-between text-[9px] font-black uppercase text-white/40 tracking-tighter">
                                                                                            <span>Progreso: {progreso.toFixed(0)}%</span>
                                                                                            <span>Meta: {formatARS(meta)}</span>
                                                                                        </div>
                                                                                        <div className="h-2 w-full bg-white/5 rounded-full overflow-hidden">
                                                                                            <div
                                                                                                className={`h-full bg-gradient-to-r ${progreso >= 100 ? 'from-emerald-500 to-emerald-400' : 'from-blue-600 to-blue-400'} rounded-full transition-all duration-1000 shadow-[0_0_10px_rgba(59,130,246,0.3)]`}
                                                                                                style={{ width: `${progreso}%` }}
                                                                                            ></div>
                                                                                        </div>
                                                                                    </div>
                                                                                )}
                                                                            </div>

                                                                            <button
                                                                                onClick={() => {
                                                                                    resetForm();
                                                                                    setFormData(prev => ({ ...prev, seccion: 'ahorro', subcategoria: sub }));
                                                                                    setShowModal(true);
                                                                                }}
                                                                                className="w-full bg-blue-600/10 hover:bg-blue-600 border border-blue-500/20 py-3.5 rounded-2xl text-[10px] font-black uppercase tracking-widest transition-all active:scale-95 flex items-center justify-center gap-2 group/btn"
                                                                            >
                                                                                <span className="group-hover/btn:rotate-90 transition-transform"><Icons.Plus /></span>
                                                                                Cargar Alcancía
                                                                            </button>
                                                                        </div>
                                                                    </div>
                                                                );
                                                            })}
                                                        </div>
                                                    </div>
                                                )}
                                                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                                    <div className="glass p-6 rounded-3xl border border-white/10 relative overflow-hidden group">
                                                        <div className="absolute top-0 right-0 p-8 opacity-5"><p className="text-8xl font-black">{PILARES[activeTab].icon}</p></div>
                                                        <p className="text-[10px] uppercase text-gray-100/90 font-black tracking-widest mb-4">Total {activeTab}</p>
                                                        <h3 className="text-4xl font-black text-white mb-2">{formatARS(total)}</h3>
                                                        <p className="text-xs text-gray-100/70 font-medium">{items.length} movimientos</p>
                                                    </div>
                                                    <div className="md:col-span-2 glass p-6 rounded-3xl border border-white/10 flex flex-col md:flex-row items-center gap-8">
                                                        <div className="relative w-32 h-32 shrink-0">
                                                            <ResponsiveContainer width="100%" height="100%">
                                                                <PieChart>
                                                                    <Pie data={pieSubData} cx="50%" cy="50%" innerRadius={40} outerRadius={55} paddingAngle={4} dataKey="value" stroke="none">
                                                                        {pieSubData.map((entry, i) => <Cell key={i} fill={colors[i % colors.length]} cornerRadius={6} />)}
                                                                    </Pie>
                                                                    <Tooltip
                                                                        formatter={(v) => formatARS(v)}
                                                                        contentStyle={{ background: '#111421', border: 'none', borderRadius: '15px' }}
                                                                        itemStyle={{ color: '#fff', fontWeight: 'bold' }}
                                                                    />
                                                                </PieChart>
                                                            </ResponsiveContainer>
                                                        </div>
                                                        <div className="flex-1 w-full space-y-2">
                                                            {pieSubData.slice(0, 3).map((d, i) => (
                                                                <div key={i} className="space-y-1">
                                                                    <div className="flex justify-between text-[10px] font-bold">
                                                                        <span className="text-white/60">{d.name}</span>
                                                                        <span className="text-white font-black">{total > 0 ? ((d.value / total) * 100).toFixed(0) : 0}%</span>
                                                                    </div>
                                                                    <div className="h-1 w-full bg-white/5 rounded-full overflow-hidden">
                                                                        <div className="h-full rounded-full transition-all duration-1000" style={{ width: `${total > 0 ? (d.value / total) * 100 : 0}%`, background: colors[i % colors.length] }}></div>
                                                                    </div>
                                                                </div>
                                                            ))}
                                                        </div>
                                                    </div>
                                                </div>
                                                <div className="glass p-6 rounded-3xl border border-white/5">
