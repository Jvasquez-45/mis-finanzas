                                                        <input type="number" required inputMode="decimal" placeholder="0" value={formData.monto} onChange={e => setFormData({ ...formData, monto: e.target.value })} className="w-full p-4 pl-10 bg-white/5 border border-white/10 rounded-xl outline-none focus:border-blue-500 transition-all font-mono font-bold" />
                                                    </div>
                                                </div>
                                                <div>
                                                    <label className="text-[10px] uppercase text-gray-100/90 font-black tracking-widest block mb-1.5">Fecha</label>
                                                    <div className="relative">
                                                        <span className="absolute left-4 top-1/2 -translate-y-1/2 text-blue-400 pointer-events-none">
                                                            <Icons.Calendar className="w-4 h-4" />
                                                        </span>
                                                        <input type="date" required value={formData.fecha} onChange={e => setFormData({ ...formData, fecha: e.target.value })} className="w-full p-4 pl-12 bg-white/5 border border-white/10 rounded-xl outline-none focus:border-blue-500 transition-all font-bold" />
                                                    </div>
                                                </div>
                                            </div>
                                        </div>

                                        {/* SECCIÓN 2: CAMPOS ESPECIALIZADOS POR TAB */}
                                        <div className="pt-6 border-t border-white/10 space-y-5">

                                            {/* FORM GASTOS */}
                                            {formData.formTab === 'gastos' && (
                                                <div className="space-y-4 animate-fade">
                                                    <div className="grid grid-cols-2 gap-4">
                                                        <div>
                                                            <label className="text-[10px] uppercase text-gray-100/90 font-black tracking-widest block mb-1.5">Tienda / Lugar</label>
                                                            <input list="frequent-stores" type="text" placeholder="Ej: Starbucks" value={formData.tienda} onChange={e => setFormData({ ...formData, tienda: e.target.value })} className="w-full p-4 bg-white/5 border border-white/10 rounded-xl outline-none focus:border-blue-500 transition-all" />
                                                            <datalist id="frequent-stores">{profile.tiendasFrecuentes?.map(s => <option key={s} value={s} />)}</datalist>
                                                        </div>
                                                        <div>
                                                            <label className="text-[10px] uppercase text-gray-100/90 font-black tracking-widest block mb-1.5">Subcategoría</label>
                                                            <select value={formData.subcategoria} onChange={e => setFormData({ ...formData, subcategoria: e.target.value })} className="w-full p-4 bg-white/5 border border-white/10 rounded-xl outline-none appearance-none cursor-pointer focus:border-blue-500 transition-all font-bold">
                                                                {(profile.categories || PILARES).gastos.subcategorias.map(s => <option key={s} value={s} className="bg-slate-900">{s}</option>)}
                                                            </select>
                                                        </div>
                                                    </div>
                                                    <div className="space-y-4">
                                                        <label className="text-[10px] uppercase text-blue-400 font-bold tracking-wider block">Método de Pago</label>
                                                        <div className="grid grid-cols-2 sm:grid-cols-3 gap-2">
                                                            {MEDIOS_PAGO.map(m => (
                                                                <button key={m.id} type="button" onClick={() => setFormData({ ...formData, metodoPago: m.id })} className={`flex items-center gap-2 p-3 rounded-xl border transition-all text-xs ${formData.metodoPago === m.id ? 'bg-blue-600/20 border-blue-500 text-white' : 'bg-white/5 border-white/10 text-gray-100/90 hover:bg-white/10'}`}>
                                                                    <span>{m.icon}</span>
                                                                    <span className="truncate font-bold">{m.nombre}</span>
                                                                </button>
                                                            ))}
                                                        </div>
                                                    </div>
                                                </div>
                                            )}

                                            {/* FORM INGRESOS */}
                                            {formData.formTab === 'ingresos' && (
                                                <div className="space-y-4 animate-fade">
                                                    <div className="grid grid-cols-2 gap-4">
                                                        <div>
                                                            <label className="text-[10px] uppercase text-gray-100/90 font-black tracking-widest block mb-1.5">Fuente de Ingreso</label>
                                                            <select value={formData.fuenteIngreso} onChange={e => setFormData({ ...formData, fuenteIngreso: e.target.value, subcategoria: e.target.value })} className="w-full p-4 bg-white/5 border border-white/10 rounded-xl outline-none appearance-none cursor-pointer focus:border-blue-500 transition-all font-bold">
                                                                {FUENTES_INGRESO.map(f => <option key={f} value={f} className="bg-slate-900">{f}</option>)}
                                                            </select>
                                                        </div>
                                                        <div>
                                                            <label className="text-[10px] uppercase text-gray-100/90 font-black tracking-widest block mb-1.5">Subcategoría (Pilar)</label>
                                                            <select value={formData.subcategoria} onChange={e => setFormData({ ...formData, subcategoria: e.target.value })} className="w-full p-4 bg-white/5 border border-white/10 rounded-xl outline-none appearance-none cursor-pointer focus:border-blue-500 transition-all font-bold">
                                                                {(profile.categories || PILARES).ingresos.subcategorias.map(s => <option key={s} value={s} className="bg-slate-900">{s}</option>)}
                                                            </select>
                                                        </div>
                                                    </div>
                                                </div>
                                            )}

                                            {/* FORM INVERSIONES */}
                                            {formData.formTab === 'inversiones' && (
                                                <div className="space-y-4 animate-fade">
                                                    <div className="grid grid-cols-2 gap-4">
                                                        <div>
                                                            <label className="text-[10px] uppercase text-gray-100/90 font-black tracking-widest block mb-1.5">Tipo de Inversión</label>
                                                            <select value={formData.inversionTipo} onChange={e => setFormData({ ...formData, inversionTipo: e.target.value, subcategoria: e.target.value })} className="w-full p-4 bg-white/5 border border-white/10 rounded-xl outline-none appearance-none cursor-pointer focus:border-blue-500 transition-all font-bold">
                                                                {TIPO_INVERSIONES.map(t => <option key={t} value={t} className="bg-slate-900">{t}</option>)}
                                                            </select>
                                                        </div>
                                                        <div>
                                                            <label className="text-[10px] uppercase text-gray-100/90 font-black tracking-widest block mb-1.5">Plataforma</label>
                                                            <select value={formData.plataforma} onChange={e => setFormData({ ...formData, plataforma: e.target.value })} className="w-full p-4 bg-white/5 border border-white/10 rounded-xl outline-none appearance-none cursor-pointer focus:border-blue-500 transition-all font-bold">
                                                                <option value="" className="bg-slate-900">Seleccionar...</option>
                                                                {PLATAFORMAS_INV.map(p => <option key={p} value={p} className="bg-slate-900">{p}</option>)}
                                                            </select>
                                                        </div>
                                                    </div>
                                                    {formData.moneda === 'CRIPTO' && (
                                                        <div className="p-4 bg-amber-500/10 border border-amber-500/20 rounded-2xl space-y-4 animate-pop">
                                                            <p className="text-[9px] uppercase font-black text-amber-500 tracking-[0.2em]">Detalles Cripto ₿</p>
                                                            <div className="grid grid-cols-2 gap-4">
                                                                <div>
                                                                    <label className="text-[8px] uppercase font-black text-white/60 block mb-1">Acción</label>
                                                                    <select value={formData.accionCripto} onChange={e => setFormData({ ...formData, accionCripto: e.target.value })} className="w-full p-3 bg-slate-900 border border-white/10 rounded-xl text-xs font-bold outline-none">
                                                                        {ACCIONES_CRIPTO.map(a => <option key={a} value={a}>{a}</option>)}
                                                                    </select>
                                                                </div>
                                                                <div>
                                                                    <label className="text-[8px] uppercase font-black text-white/60 block mb-1">Ticker (Ej: ETH)</label>
                                                                    <input type="text" placeholder="ETH" value={formData.cryptoTicker} onChange={e => setFormData({ ...formData, cryptoTicker: e.target.value.toUpperCase() })} className="w-full p-3 bg-slate-900 border border-white/10 rounded-xl text-xs font-mono font-bold outline-none" />
                                                                </div>
                                                            </div>
                                                        </div>
                                                    )}
                                                </div>
                                            )}

                                            {/* FORM AHORRO */}
                                            {formData.formTab === 'ahorro' && (
                                                <div className="space-y-4 animate-fade">
                                                    <div className="grid grid-cols-2 gap-4">
                                                        <div>
                                                            <label className="text-[10px] uppercase text-gray-100/90 font-black tracking-widest block mb-1.5">Plataforma / Lugar</label>
                                                            <select value={formData.plataforma} onChange={e => setFormData({ ...formData, plataforma: e.target.value })} className="w-full p-4 bg-white/5 border border-white/10 rounded-xl outline-none appearance-none cursor-pointer focus:border-blue-500 transition-all font-bold">
                                                                <option value="" className="bg-slate-900">Lugar del ahorro...</option>
                                                                {PLATAFORMAS_AHORRO.map(p => <option key={p} value={p} className="bg-slate-900">{p}</option>)}
                                                            </select>
                                                        </div>
                                                        <div>
                                                            <label className="text-[10px] uppercase text-gray-100/90 font-black tracking-widest block mb-1.5">Alcancía (Categoría)</label>
                                                            <select value={formData.subcategoria} onChange={e => setFormData({ ...formData, subcategoria: e.target.value })} className="w-full p-4 bg-white/5 border border-white/10 rounded-xl outline-none appearance-none cursor-pointer focus:border-blue-500 transition-all font-bold">
                                                                {(profile.categories || PILARES).ahorro.subcategorias.map(s => <option key={s} value={s} className="bg-slate-900">{s}</option>)}
                                                            </select>
                                                        </div>
                                                    </div>
                                                </div>
                                            )}
                                        </div>

                                        {/* SECCIÓN 3: DETALLES DE PAGO (SOLO GASTOS) */}
                                        {formData.formTab === 'gastos' && formData.metodoPago !== 'efectivo' && (
                                            <div className="glass p-4 rounded-xl space-y-4 animate-fade">
                                                <p className="text-xs text-white/60 flex items-center gap-2">💳 Configuración de Cuotas</p>
                                                <div className="grid grid-cols-3 gap-3">
                                                    <div>
                                                        <label className="text-[10px] uppercase text-gray-100/90 font-bold tracking-wider block mb-2">Cuotas</label>
                                                        <select value={formData.cuotas} onChange={e => setFormData({ ...formData, cuotas: e.target.value })} className="w-full p-3 bg-slate-800 border border-white/10 rounded-lg outline-none focus:border-purple-500 transition-all text-center appearance-none cursor-pointer">
                                                            {[...Array(12)].map((_, i) => <option key={i + 1} value={i + 1}>{i + 1}</option>)}
                                                        </select>
                                                    </div>
                                                    <div>
                                                        <label className="text-[10px] uppercase text-gray-100/90 font-bold tracking-wider block mb-2">Cuota Actual</label>
                                                        <input type="number" inputMode="numeric" placeholder="1" value={formData.cuotaActual} onChange={e => setFormData({ ...formData, cuotaActual: e.target.value })} className="w-full p-3 bg-white/5 border border-white/10 rounded-lg outline-none focus:border-purple-500 transition-all text-center" />
                                                    </div>
                                                    <div>
                                                        <label className="text-[10px] uppercase text-white/40 font-bold tracking-wider block mb-2">Día Venc.</label>
                                                        <input type="number" inputMode="numeric" placeholder="10" value={formData.diaVencimiento} onChange={e => setFormData({ ...formData, diaVencimiento: e.target.value })} className="w-full p-3 bg-white/5 border border-white/10 rounded-lg outline-none focus:border-purple-500 transition-all text-center" />
                                                    </div>
                                                </div>
                                            </div>
                                        )}

                                        <button type="submit" disabled={isSaving} className="w-full btn-premium p-4 rounded-2xl font-black text-xs uppercase tracking-[0.3em] flex items-center justify-center gap-3 shadow-xl active:scale-95 transition-all">
                                            {isSaving ? <Icons.Loader /> : (editingId ? 'Actualizar Movimiento' : 'Confirmar y Guardar')}
                                        </button>
                                    </form>
                                </div>
                            </div>
                        )
                    }
                </div >
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
