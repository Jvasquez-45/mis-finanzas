    <style>
        * {
            font-family: 'Inter', system-ui, sans-serif;
        }

        /* Fondo Premium Cocos Style */
        body {
            background-color: #000d1a !important;
            background-image:
                radial-gradient(at 0% 0%, hsla(210, 100%, 20%, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 0%, hsla(220, 100%, 30%, 0.1) 0px, transparent 50%),
                radial-gradient(at 100% 100%, hsla(200, 100%, 20%, 0.15) 0px, transparent 50%),
                radial-gradient(at 0% 100%, hsla(230, 100%, 30%, 0.1) 0px, transparent 50%);
            min-height: 100vh;
            color: #fff;
            overflow-x: hidden;
        }

        .bg-fluid {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: -1;
            filter: blur(100px);
            opacity: 0.6;
            pointer-events: none;
        }

        .blob {
            position: absolute;
            width: 60%;
            height: 60%;
            background: radial-gradient(circle, #0066ff 0%, transparent 70%);
            border-radius: 50%;
            animation: move 20s infinite alternate;
        }

        .blob-1 {
            top: -10%;
            left: -10%;
            background: radial-gradient(circle, #0055ff 0%, transparent 70%);
        }

        .blob-2 {
            bottom: -10%;
            right: -10%;
            background: radial-gradient(circle, #0099ff 0%, transparent 70%);
            animation-delay: -5s;
        }

        .blob-3 {
            top: 40%;
            left: 30%;
            width: 40%;
            height: 40%;
            background: radial-gradient(circle, #0033ff 0%, transparent 70%);
            animation-duration: 25s;
        }

        @keyframes move {
            from {
                transform: translate(0, 0) scale(1);
            }

            to {
                transform: translate(10%, 10%) scale(1.1);
            }
        }

        .glass {
            background: #1a1c2e;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
        }

        .glass-dark {
            background: #111421;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
        }


        .btn-premium {
            background: #0066ff;
            box-shadow: 0 0 20px rgba(0, 102, 255, 0.4);
            transition: all 0.3s ease;
        }

        .btn-premium:hover {
            box-shadow: 0 0 30px rgba(0, 102, 255, 0.6);
            transform: translateY(-2px);
        }

        /* BACKGROUND SISTEM NIVO */
        .nivo-bg {
            position: fixed;
            inset: 0;
            z-index: -1;
            background-size: cover;
            background-position: center;
            filter: blur(15px) brightness(0.7);
            transform: scale(1.1);
            /* Evita bordes blancos por blur */
            transition: background-image 0.5s ease-in-out;
        }

        /* Responsive Backgrounds */
        @media (max-width: 768px) {
            .nivo-bg {
                background-image: url('fondo/24483412.png');
            }
        }

        @media (min-width: 769px) {
            .nivo-bg {
                background-image: url('fondo/2448341.png');
            }
        }

        .glass-white {
            background: #232742;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);
        }

        .blob1,
        .blob2,
        .blob3 {
            display: none !important;
        }

        /* Reemplazamos los blobs por el fondo oficial */


        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes popIn {
            from {
                opacity: 0;
                transform: scale(0.8);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes stagger {
            from {
                opacity: 0;
                transform: translateX(-10px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .animate-fade {
            animation: fadeIn 0.4s ease-out forwards;
        }

        .animate-slide {
            animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .animate-pop {
            animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        .animate-stagger {
            animation: stagger 0.3s ease-out forwards;
        }

        .custom-scroll::-webkit-scrollbar {
            width: 4px;
        }

        .custom-scroll::-webkit-scrollbar-track {
            background: transparent;
        }

        .custom-scroll::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }

        .toast {
            animation: slideUp 0.3s ease-out, fadeIn 0.3s ease-out reverse forwards 2.5s;
        }

        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
        }

        /* Date Picker Refinement */
        input[type="date"]::-webkit-calendar-picker-indicator {
            background: transparent;
            bottom: 0;
            color: transparent;
            cursor: pointer;
            height: auto;
            left: 0;
            position: absolute;
            right: 0;
            top: 0;
            width: auto;
        }

        input[type="date"] {
            position: relative;
        }

        input[type="date"]::-webkit-datetime-edit-fields-wrapper {
            color: #fff;
            padding-left: 24px;
        }

        input[type="date"]::-webkit-datetime-edit-text,
        input[type="date"]::-webkit-datetime-edit-month-field,
        input[type="date"]::-webkit-datetime-edit-day-field,
        input[type="date"]::-webkit-datetime-edit-year-field {
            color: rgba(255, 255, 255, 0.4);
            font-weight: 800;
        }

        input[type="date"]:focus::-webkit-datetime-edit-text,
        input[type="date"]:focus::-webkit-datetime-edit-month-field,
        input[type="date"]:focus::-webkit-datetime-edit-day-field,
        input[type="date"]:focus::-webkit-datetime-edit-year-field {
            color: #fff;
        }
    </style>
</head>

<body class="text-white overflow-x-hidden">
    <div class="nivo-bg"></div>
    <div id="root" class="relative z-10"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect, useCallback, useRef } = React;
        const { PieChart, Pie, Cell, AreaChart, Area, XAxis, YAxis, Tooltip, ResponsiveContainer, Legend } = Recharts;

        // ═══════════════════════════════════════════════════════════════
        // FASE 0: COMPONENTES EXTRA
        // ═══════════════════════════════════════════════════════════════

        const FRASES_MOTIVACIONALES = [
            "El dinero es un excelente siervo, pero un pésimo amo.",
            "Cuida de los pequeños gastos; un pequeño agujero hunde un gran barco.",
            "No ahorres lo que queda después de gastar, gasta lo que queda después de ahorrar.",
            "La riqueza no consiste en tener grandes posesiones, sino en tener pocas necesidades.",
            "Invertir en conocimientos produce siempre los mejores intereses.",
            "El camino a la riqueza depende de dos palabras: trabajo y ahorro.",
            "Quien compra lo que no necesita, pronto tendrá que vender lo que necesita."
        ];

        const CoachFinanciero = ({ transactions = [], totals = {}, profile = {} }) => {
            const fraseDiaria = useMemo(() => {
                const dayOfYear = Math.floor((new Date() - new Date(new Date().getFullYear(), 0, 0)) / (1000 * 60 * 60 * 24));
                const baseFrase = FRASES_MOTIVACIONALES[dayOfYear % FRASES_MOTIVACIONALES.length];

                // Personalización
                if (profile.nombre) {
                    const hobbiesLine = profile.hobbies ? ` Incluso mientras disfrutas de ${profile.hobbies.split(',')[0]}, recuerda que el ahorro es libertad.` : '';
                    return `Hola ${profile.nombre}, ${baseFrase}${hobbiesLine}`;
                }
                return baseFrase;
            }, [profile.nombre, profile.hobbies]);

            const analisis = useMemo(() => {
                const hoy = new Date();
                const haceUnaSemana = new Date();
                haceUnaSemana.setDate(hoy.getDate() - 7);

                const trSemana = transactions.filter(t => new Date(t.fecha) >= haceUnaSemana);
                const gastosSemana = trSemana.filter(t => t.tipo === 'gasto').reduce((s, t) => s + (t.monto || 0), 0);
                const ingresosSemana = trSemana.filter(t => t.tipo === 'ingreso').reduce((s, t) => s + (t.monto || 0), 0);

                let mensaje = null;
                let tipo = 'info';

                if (gastosSemana > ingresosSemana * 0.5 && ingresosSemana > 0) {
                    const catMayor = trSemana.filter(t => t.tipo === 'gasto').reduce((acc, t) => {
                        acc[t.subcategoria] = (acc[t.subcategoria] || 0) + t.monto;
                        return acc;
                    }, {});
                    const topCat = Object.entries(catMayor).sort((a, b) => b[1] - a[1])[0]?.[0] || 'tus consumos';
                    mensaje = `¡Atención, ${profile.nombre || 'Jose'}! Tus gastos en ${topCat} están subiendo. ¿Podemos optimizarlos para asegurar tu futuro?`;
                    tipo = 'warning';
                } else if (totals.balance > 0) {
                    const extra = profile.edad ? ` A tus ${profile.edad} años, este hábito es clave.` : '';
                    mensaje = `¡Excelente gestión, ${profile.nombre || ''}! Has guardado más de lo planeado.${extra} 🚀`;
                    tipo = 'success';
                }

                const esDomingo = hoy.getDay() === 0;
                const semanaGanadora = esDomingo && totals.balance > 0;

                return { mensaje, tipo, semanaGanadora };
            }, [transactions, totals.balance, profile.nombre, profile.edad]);

            return (
                <div className="space-y-4 animate-fade">
                    {analisis.semanaGanadora && (
                        <div className="glass-dark border-emerald-500/30 p-6 rounded-[2rem] text-center overflow-hidden relative group">
                            <div className="absolute inset-0 bg-emerald-500/5 animate-pulse"></div>
                            <h3 className="text-xl font-black text-emerald-400 mb-1">🎊 ¡SEMANA GANADORA! 🎊</h3>
                            <p className="text-sm font-bold text-white">Has terminado la semana con balance positivo. ¡Sigue así!</p>
                        </div>
                    )}

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        {/* Inspiración */}
                        <div className="bg-[#1a1c2e] p-6 rounded-[2.5rem] border border-blue-500/20 flex gap-5 items-center relative overflow-hidden group shadow-2xl">
                            <div className="absolute inset-0 bg-blue-500/5 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                            <div className="w-12 h-12 rounded-2xl bg-white/5 flex items-center justify-center text-2xl shadow-inner border border-white/10">💡</div>
                            <div className="relative z-10">
                                <p className="text-[10px] uppercase text-blue-400 font-black tracking-widest mb-1">Inspiración Diaria</p>
                                <p className="text-sm font-bold italic text-white leading-relaxed">"{fraseDiaria}"</p>
                            </div>
                        </div>

                        {/* Análisis */}
                        {analisis.mensaje && (
                            <div className={`p-6 rounded-[2.5rem] flex gap-5 items-center animate-slide relative overflow-hidden group shadow-2xl ${analisis.tipo === 'warning' ? 'bg-[#1a1c2e] border border-rose-500/30' : 'bg-[#1a1c2e] border border-emerald-500/30'}`}>
                                <div className={`w-12 h-12 rounded-2xl flex items-center justify-center text-2xl shadow-inner border ${analisis.tipo === 'warning' ? 'bg-rose-500/10 border-rose-500/20' : 'bg-emerald-500/10 border-emerald-500/20'}`}>
                                    {analisis.tipo === 'warning' ? '⚠️' : '🎯'}
                                </div>
                                <div className="relative z-10">
                                    <div className="flex items-center gap-2 mb-1">
                                        <p className={`text-[10px] uppercase font-black tracking-widest ${analisis.tipo === 'warning' ? 'text-rose-400' : 'text-emerald-400'}`}>Analista ARS Pro</p>
                                        <span className={`px-1.5 py-0.5 rounded-full text-[8px] font-black uppercase text-white/50 border border-white/10`}>AI Coach</span>
                                    </div>
                                    <p className="text-sm font-bold text-white leading-tight">{analisis.mensaje}</p>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const firebaseConfig = {
            apiKey: "AIzaSyCiJwLv-jw1EQT3FNT6gdWw2NV51UxvbQU",
            authDomain: "finanzas-44f11.firebaseapp.com",
            projectId: "finanzas-44f11",
            storageBucket: "finanzas-44f11.firebasestorage.app",
            messagingSenderId: "403874855146",
            appId: "1:403874855146:web:1f0bc48e339e06316cff93"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const appId = 'finanzas-44f11-app';

        // CONSTANTES DE MODELO DE DATOS
        const PILARES = {
            gastos: { nombre: 'Gasto', tipo: 'gasto', color: '#f43f5e', icon: '💸', subcategorias: ['Alquiler', 'Luz', 'Agua', 'Gas', 'Internet', 'Servicio de Streaming', 'Personal', 'Ocio', 'Limpieza e Higiene', 'Movilidad', 'Otros'] },
            ahorro: { nombre: 'Ahorro', tipo: 'ahorro', color: '#3b82f6', icon: '🏦', subcategorias: ['Ahorro en pesos', 'Ahorro personal'] },
            inversiones: { nombre: 'Inversión', tipo: 'inversion', color: '#06b6d4', icon: '📈', subcategorias: ['IOL Letras', 'IOL Acciones', 'IOL CEDEARS', 'Fondo Común de Inversiones (FCI)'] },
            ingresos: { nombre: 'Ingreso', tipo: 'ingreso', color: '#10b981', icon: '💰', subcategorias: ['Sueldo', 'Marketing', 'Moto (Uber/Didi)', 'Ventas', 'Otros'] }
        };

        const TIPO_INVERSIONES = ['Acciones', 'Cedears', 'FCI', 'Letras', 'Plazo Fijo', 'Cripto', 'Otros'];
        const PLATAFORMAS_INV = ['IOL', 'Balanz', 'Bull Market', 'Binance', 'Lemon', 'Buenbit', 'Otro'];
        const PLATAFORMAS_AHORRO = ['Efectivo', 'Banco de la Nación', 'Galicia', 'Mercado Pago', 'Dólar Billete', 'Cripto (Wallet/Exch)', 'Otro'];
        const FUENTES_INGRESO = ['Sueldo', 'Marketing', 'Moto Taxi', 'Freelance', 'Venta', 'Dividendo', 'Otro'];
        const ACCIONES_CRIPTO = ['Compra Directa', 'Staking', 'Rendimiento'];

        const MEDIOS_PAGO = [
            { id: 'efectivo', nombre: 'Efectivo/Débito', icon: '💵' },
            { id: 'visa', nombre: 'Visa', icon: '💳' },
            { id: 'mastercard', nombre: 'Mastercard', icon: '💳' },
            { id: 'amex', nombre: 'Amex', icon: '💳' },
            { id: 'otro_tarjeta', nombre: 'Otra Tarjeta', icon: '💳' }
        ];

        const TABS = [
            { id: 'dashboard', nombre: 'Resumen', icon: '📊' },
            { id: 'gastos', nombre: 'Gastos', icon: '💸' },
            { id: 'tarjetas', nombre: 'Tarjetas', icon: '💳' },
            { id: 'ahorro', nombre: 'Ahorro', icon: '🏦' },
            { id: 'inversiones', nombre: 'Inversiones', icon: '📈' },
            { id: 'ingresos', nombre: 'Ingresos', icon: '💰' },
            { id: 'analisis', nombre: 'Análisis', icon: '📉' },
            { id: 'perfil', nombre: 'Perfil', icon: '👤' }
        ];

        const MOTIVATIONAL_PHRASES = [
            "El éxito financiero no es cuánto ganas, sino cuánto conservas. 💰",
            "La mejor inversión que puedes hacer es en ti mismo. 🚀",
            "Pequeños ahorros hoy construyen grandes futuros mañana. 🏗️",
            "No ahorres lo que te sobra después de gastar; gasta lo que te sobra después de ahorrar. 📉",
            "El dinero es un gran siervo pero un mal amo. 🧠",
            "Tu libertad financiera comienza con un presupuesto responsable. 📋",
            "Cada peso cuenta en la carrera hacia tus metas. 🏁",
            "La disciplina financiera es el puente entre tus metas y tus logros. 🌉",
            "No mires el reloj de la riqueza; planta las semillas del ahorro. 🌱",
            "Gastar menos de lo que ganas es la base de la abundancia. 💎"
        ];

        // ═══════════════════════════════════════════════════════════════
        // ICONOS SVG
        // ═══════════════════════════════════════════════════════════════
        const Icons = {
            Plus: ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M12 5v14M5 12h14" /></svg>,
            X: ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M18 6L6 18M6 6l12 12" /></svg>,
            Trash: ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2" /></svg>,
            Edit: ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z" /></svg>,
            Alert: ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0zM12 9v4M12 17h.01" /></svg>,
            Loader: ({ className }) => <svg className={`animate-spin ${className}`} xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M12 2v4m0 12v4M4.93 4.93l2.83 2.83m8.48 8.48l2.83 2.83M2 12h4m12 0h4M4.93 19.07l2.83-2.83m8.48-8.48l2.83-2.83" /></svg>,
            Check: ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><polyline points="20 6 9 17 4 12" /></svg>,
            Filter: ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z" /></svg>,
            Calendar: ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2" /><line x1="16" y1="2" x2="16" y2="6" /><line x1="8" y1="2" x2="8" y2="6" /><line x1="3" y1="10" x2="21" y2="10" /></svg>,
            ChevronDown: ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M6 9l6 6 6-6" /></svg>,
            Tarjeta: ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="2" y="5" width="20" height="14" rx="2" /><line x1="2" y1="10" x2="22" y2="10" /></svg>,
            Trend: ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18" /><polyline points="17 6 23 6 23 12" /></svg>,
            User: ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2" /><circle cx="12" cy="7" r="4" /></svg>,
            LogOut: ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9" /></svg>,
            Store: ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z" /><polyline points="9 22 9 12 15 12 15 22" /></svg>,
            Safe: ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" /></svg>
        };

        // ═══════════════════════════════════════════════════════════════
        // UTILIDADES
        // ═══════════════════════════════════════════════════════════════
        const formatARS = (v) => new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS', maximumFractionDigits: 0 }).format(v || 0);
        const today = () => new Date().toISOString().split('T')[0];

        // ═══════════════════════════════════════════════════════════════
        // COMPONENTES DE APOYO
        // ═══════════════════════════════════════════════════════════════

        const AuthView = () => {
            const [isLogin, setIsLogin] = useState(true);
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState(null);

            const handleGoogleLogin = async () => {
                setLoading(true);
                setError(null);
                try {
                    const provider = new firebase.auth.GoogleAuthProvider();
                    await auth.signInWithPopup(provider);
                } catch (e) {
                    console.error('Auth Error:', e);
                    if (e.code === 'auth/operation-not-supported-in-this-environment') {
                        setError('Ambiente no preparado. Debes usar un servidor local (http/https).');
                    } else if (e.code === 'auth/unauthorized-domain') {
                        setError('Dominio no autorizado en Firebase (localhost).');
                    } else {
                        setError(e.message);
                    }
                } finally { setLoading(false); }
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                setLoading(true);
                setError(null);
                try {
                    if (isLogin) {
                        await auth.signInWithEmailAndPassword(email, password);
                    } else {
                        await auth.createUserWithEmailAndPassword(email, password);
                    }
                } catch (e) {
                    setError(e.message);
                } finally { setLoading(false); }
            };

            return (
                <div className="min-h-screen flex items-center justify-center p-6 bg-[#000d1a] relative overflow-hidden">
                    {/* Fluid Background Blobs */}
                    <div className="bg-fluid">
                        <div className="blob blob-1"></div>
                        <div className="blob blob-2"></div>
                        <div className="blob blob-3"></div>
                    </div>

                    <div className="glass p-1 w-full max-w-md rounded-[3rem] border-white/5 shadow-[0_20px_50px_rgba(0,0,0,0.5)] relative z-10">
                        <div className="p-8 md:p-10 rounded-[2.9rem] bg-black/20 backdrop-blur-3xl">
                            <div className="text-center mb-8">
                                <div className="w-16 h-16 bg-blue-600 rounded-3xl flex items-center justify-center text-3xl mb-6 mx-auto shadow-[0_0_40px_rgba(0,102,255,0.5)] animate-pop">
                                    <span>💎</span>
                                </div>
                                <h1 className="text-4xl font-black tracking-tighter text-white mb-2 text-glow">
                                    ARS Pro
                                </h1>
                                <p className="text-blue-400 text-[10px] uppercase font-black tracking-[0.3em]">
                                    Experience Premium
                                </p>
                            </div>

                            <div className="bg-blue-500/10 border border-blue-500/20 p-4 rounded-2xl mb-8">
                                <p className="text-[10px] text-indigo-300 font-bold uppercase leading-relaxed text-center">
                                    🛡️ Tus datos se cifran y sincronizan automáticamente entre todos tus dispositivos de forma segura.
                                </p>
                            </div>

                            <form onSubmit={handleSubmit} className="space-y-4">
                                <div>
                                    <input
                                        type="email"
                                        required
                                        value={email}
                                        onChange={e => setEmail(e.target.value)}
                                        className="w-full p-4 bg-white/5 border border-white/10 rounded-2xl outline-none focus:border-blue-500 transition-all font-medium text-sm text-white"
                                        placeholder="Tu correo electrónico"
                                    />
                                </div>
                                <div>
                                    <input
                                        type="password"
                                        required
                                        value={password}
                                        onChange={e => setPassword(e.target.value)}
                                        className="w-full p-4 bg-white/5 border border-white/10 rounded-2xl outline-none focus:border-blue-500 transition-all font-medium text-sm text-white"
                                        placeholder="Tu contraseña"
                                    />
                                </div>

                                {error && (
                                    <div className="p-3 bg-rose-500/10 border border-rose-500/20 rounded-xl animate-fade">
                                        <p className="text-rose-400 text-[9px] font-bold uppercase text-center">{error}</p>
                                    </div>
                                )}

                                <button
                                    type="submit"
                                    disabled={loading}
                                    className="w-full btn-premium text-white py-4 rounded-2xl font-black text-xs uppercase tracking-widest transition-all active:scale-95 flex items-center justify-center"
                                >
                                    {loading ? <Icons.Loader /> : (isLogin ? 'Entrar ahora' : 'Empezar ahora')}
                                </button>
                            </form>

                            <div className="relative my-8">
                                <div className="absolute inset-0 flex items-center"><div className="w-full border-t border-white/5"></div></div>
                                <div className="relative flex justify-center text-[9px] uppercase font-black tracking-widest text-white/40"><span className="bg-[#1e293b] px-4">Acceso rápido</span></div>
                            </div>

                            <button
                                onClick={handleGoogleLogin}
                                disabled={loading}
                                className="w-full bg-white text-slate-900 py-4 rounded-2xl font-black text-xs uppercase tracking-widest transition-all hover:bg-gray-100 flex items-center justify-center gap-3 active:scale-95"
                            >
                                <svg className="w-4 h-4" viewBox="0 0 24 24"><path fill="currentColor" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" /><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" /><path fill="#FBBC05" d="M5.84 14.1c-.22-.66-.35-1.36-.35-2.1s.13-1.44.35-2.1V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l3.66-2.84z" /><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" /></svg>
                                Google
                            </button>

                            <button
                                onClick={() => setIsLogin(!isLogin)}
                                className="w-full mt-6 text-blue-400 text-[10px] font-bold uppercase tracking-widest hover:text-blue-300 transition-colors font-bold"
                            >
                                {isLogin ? '¿No tienes cuenta? Regístrate gratis' : 'Ya tengo cuenta, quiero entrar'}
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        // DIAGNÓSTICOS DE NUBE (SUBTLE)
        const CloudDiagnostics = ({ user }) => (
            <div className="mt-12 pt-8 border-t border-white/5 opacity-40 hover:opacity-100 transition-opacity">
                <p className="text-[8px] uppercase font-black tracking-[0.3em] mb-4 text-center">Cloud Diagnostics</p>
                <div className="grid grid-cols-2 gap-4 text-[9px] font-mono">
                    <div className="glass p-3 rounded-xl border border-white/10">
                        <p className="text-gray-100/90 mb-1">Authenticated ID</p>
                        <p className="truncate">{user?.uid || 'Not Set'}</p>
                    </div>
                    <div className="glass p-3 rounded-xl border border-white/10">
                        <p className="text-gray-100/90 mb-1">Target Collection</p>
                        <p>usuarios/.../transacciones</p>
                    </div>
                </div>
                {!window.location.hostname.includes('localhost') && !window.location.hostname.includes('127.0.0.1') && (
                    <div className="mt-4 p-3 bg-amber-500/10 border border-amber-500/20 rounded-xl text-center">
                        <p className="text-amber-400 font-bold">⚠️ ESTÁS EN PRODUCCIÓN (GitHub Pages)</p>
                        <p className="text-gray-100/90 mt-1">Los cambios locales (localhost:3000) NO se verán aquí hasta que se despliegue.</p>
                    </div>
                )}
            </div>
        );

        const ProfileView = ({ user, profile, setProfile, onLogout, onDeleteAccount, totals, comparisonData, insights, syncInfo }) => {
            const [newStore, setNewStore] = useState('');
            const [newInversion, setNewInversion] = useState('');
            const [isEditingInfo, setIsEditingInfo] = useState(false);
            const [tempInfo, setTempInfo] = useState({
                nombre: profile.nombre || '',
                apellido: profile.apellido || '',
                email: profile.email || '',
                nacimiento: profile.nacimiento || '',
                edad: profile.edad || '',
                hobbies: profile.hobbies || ''
            });

            // Frase del día basada en la fecha
            const quote = useMemo(() => {
                const dayOfYear = Math.floor((new Date() - new Date(new Date().getFullYear(), 0, 0)) / 1000 / 60 / 60 / 24);
                return MOTIVATIONAL_PHRASES[dayOfYear % MOTIVATIONAL_PHRASES.length];
            }, []);

            const handleAddStore = () => {
                if (!newStore.trim()) return;
                if (profile.tiendasFrecuentes.includes(newStore.trim())) return;
                setProfile(prev => ({ ...prev, tiendasFrecuentes: [...prev.tiendasFrecuentes, newStore.trim()] }));
                setNewStore('');
            };

            const handleAddInversion = () => {
                if (!newInversion.trim()) return;
                if (profile.inversionesFrecuentes?.includes(newInversion.trim())) return;
                setProfile(prev => ({ ...prev, inversionesFrecuentes: [...(prev.inversionesFrecuentes || []), newInversion.trim()] }));
                setNewInversion('');
            };

            const handleRemoveStore = (store) => {
                setProfile(prev => ({ ...prev, tiendasFrecuentes: prev.tiendasFrecuentes.filter(s => s !== store) }));
            };

            const handleRemoveInversion = (inv) => {
                setProfile(prev => ({ ...prev, inversionesFrecuentes: prev.inversionesFrecuentes.filter(s => s !== inv) }));
            };

            const [selectedPilar, setSelectedPilar] = useState('gastos');
            const [newSubcategory, setNewSubcategory] = useState('');

            // Estado para creación de pilares
            const [showPilarCreator, setShowPilarCreator] = useState(false);
            const [newPilar, setNewPilar] = useState({ nombre: '', icon: '📂', color: '#6366f1', tipo: 'gasto' });

            const handleAddPilar = () => {
                if (!newPilar.nombre.trim()) return;
                const id = 'pilar_' + Date.now();
                const updatedCats = {
                    ...(profile.categories || PILARES),
                    [id]: {
                        nombre: newPilar.nombre.trim(),
                        icon: newPilar.icon,
                        color: newPilar.color,
                        tipo: newPilar.tipo,
                        subcategorias: ['Otros']
                    }
                };
                setProfile(prev => ({ ...prev, categories: updatedCats }));
                setShowPilarCreator(false);
                setNewPilar({ nombre: '', icon: '📂', color: '#6366f1', tipo: 'gasto' });
                showToast('Pilar creado con éxito');
            };

            const handleRemovePilar = (id) => {
                const defaults = ['gastos', 'ahorro', 'inversiones', 'ingresos'];
                if (defaults.includes(id)) {
                    showToast('No se pueden borrar las categorías principales', 'error');
                    return;
                }
                const updatedCats = { ...profile.categories };
                delete updatedCats[id];
                setProfile(prev => ({ ...prev, categories: updatedCats }));
                if (selectedPilar === id) setSelectedPilar('gastos');
                showToast('Pilar eliminado');
            };

            const handleAddSubcategory = () => {
                const sub = newSubcategory.trim();
                if (!sub) return;

                const currentCats = profile.categories || PILARES;
                const pilar = currentCats[selectedPilar];

                if (!pilar) {
                    showToast('Pilar no encontrado', 'error');
                    return;
                }

                if (pilar.subcategorias.some(s => s.toLowerCase() === sub.toLowerCase())) {
                    showToast('Esta subcategoría ya existe', 'error');
                    return;
                }

                const updatedCats = {
                    ...currentCats,
                    [selectedPilar]: {
                        ...pilar,
                        subcategorias: [...pilar.subcategorias, sub]
                    }
                };
                setProfile(prev => ({ ...prev, categories: updatedCats }));
                setNewSubcategory('');
                showToast(`"${sub}" agregada a ${pilar.nombre}`);
            };

            const handleRemoveSubcategory = (sub) => {
                const currentCats = profile.categories || PILARES;
                const updatedCats = {
                    ...currentCats,
                    [selectedPilar]: {
                        ...currentCats[selectedPilar],
                        subcategorias: currentCats[selectedPilar].subcategorias.filter(s => s !== sub)
                    }
                };
                setProfile(prev => ({ ...prev, categories: updatedCats }));
            };

            const handleUpdateMeta = (pilarId, sub, value) => {
                const currentCats = profile.categories || PILARES;
                const pilar = currentCats[pilarId];
                const updatedCats = {
                    ...currentCats,
                    [pilarId]: {
                        ...pilar,
                        metas: {
                            ...(pilar.metas || {}),
                            [sub]: parseFloat(value) || 0
                        }
                    }
                };
                setProfile(prev => ({ ...prev, categories: updatedCats }));
            };

            const handleSaveInfo = () => {
                setProfile(prev => ({
                    ...prev,
                    ...tempInfo
                }));
                setIsEditingInfo(false);
                showToast('Perfíl Nivo actualizado');
            };

            return (
                <div className="space-y-8 animate-fade">
                    <div className="flex justify-between items-center mb-6">
                        <div className="flex items-center gap-4">
                            <div className="w-14 h-14 rounded-2xl flex items-center justify-center text-2xl glass-dark border-white/10 shadow-[0_0_20px_rgba(255,255,255,0.05)]">👤</div>
                            <div>
                                <h2 className="text-2xl font-black tracking-tight text-white text-glow">Mi Perfil</h2>
                                <p className="text-[10px] text-blue-400 font-bold uppercase tracking-widest">{user.email}</p>
                            </div>
                        </div>
                        <button onClick={onLogout} className="px-6 py-3 rounded-2xl border border-rose-500/20 text-rose-500 text-[10px] font-black uppercase tracking-widest hover:bg-rose-500 hover:text-white transition-all">Salir</button>
                    </div>

                    {/* Información Personal */}
                    <div className="glass p-6 rounded-[2rem] border-white/5">
                        <div className="flex justify-between items-center mb-6">
                            <h3 className="text-xs uppercase text-gray-100/90 font-bold tracking-widest flex items-center gap-2">
                                <span className="text-blue-400">📝</span> Datos Personales
                            </h3>
                            {!isEditingInfo && (
                                <button onClick={() => {
                                    setTempInfo({
                                        nombre: profile.nombre || '',
                                        apellido: profile.apellido || '',
                                        email: profile.email || user.email,
                                        nacimiento: profile.nacimiento || '',
                                        edad: profile.edad || '',
                                        hobbies: profile.hobbies || ''
                                    });
                                    setIsEditingInfo(true);
                                }} className="text-blue-400 text-[10px] font-black uppercase tracking-widest hover:text-blue-300 transition-colors">Editar Perfil</button>
                            )}
                        </div>

                        {isEditingInfo ? (
                            <div className="space-y-4 animate-fade">
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <input type="text" value={tempInfo.nombre} onChange={e => setTempInfo({ ...tempInfo, nombre: e.target.value })} placeholder="Nombre" className="w-full bg-white/5 border border-white/10 p-4 rounded-2xl text-sm outline-none focus:border-blue-500 transition-all font-bold" />
                                    <input type="text" value={tempInfo.apellido} onChange={e => setTempInfo({ ...tempInfo, apellido: e.target.value })} placeholder="Apellido" className="w-full bg-white/5 border border-white/10 p-4 rounded-2xl text-sm outline-none focus:border-blue-500 transition-all font-bold" />
                                </div>
                                <input type="email" value={tempInfo.email} onChange={e => setTempInfo({ ...tempInfo, email: e.target.value })} placeholder="Correo Electrónico" className="w-full bg-white/5 border border-white/10 p-4 rounded-2xl text-sm outline-none focus:border-blue-500 transition-all font-bold" />
                                <div className="grid grid-cols-2 gap-4">
                                    <div>
                                        <label className="text-[10px] uppercase text-gray-100/90 mb-2 block px-2">Fecha Nacimiento</label>
                                        <input type="date" value={tempInfo.nacimiento} onChange={e => setTempInfo({ ...tempInfo, nacimiento: e.target.value })} className="w-full bg-white/5 border border-white/10 p-4 rounded-2xl text-sm outline-none focus:border-blue-500 transition-all font-bold" />
                                    </div>
                                    <div>
                                        <label className="text-[10px] uppercase text-gray-100/90 mb-2 block px-2">Edad</label>
                                        <input type="number" value={tempInfo.edad} onChange={e => setTempInfo({ ...tempInfo, edad: e.target.value })} placeholder="Edad" className="w-full bg-white/5 border border-white/10 p-4 rounded-2xl text-sm outline-none focus:border-blue-500 transition-all font-bold" />
                                    </div>
                                </div>
                                <textarea value={tempInfo.hobbies} onChange={e => setTempInfo({ ...tempInfo, hobbies: e.target.value })} placeholder="Tus Hobbies (Ej: Fútbol, Programación, Viajar)" className="w-full bg-white/5 border border-white/10 p-4 rounded-2xl text-sm outline-none focus:border-blue-500 transition-all font-bold h-24" />

                                <div className="flex gap-3 pt-2">
                                    <button onClick={() => setIsEditingInfo(false)} className="flex-1 py-4 rounded-2xl border border-white/10 text-[10px] font-black uppercase tracking-widest hover:bg-white/5 transition-all">Cancelar</button>
                                    <button onClick={handleSaveInfo} className="flex-1 btn-premium text-white py-4 rounded-2xl text-[10px] font-black uppercase tracking-widest shadow-lg shadow-blue-600/20">Guardar Cambios</button>
                                </div>
                            </div>
                        ) : (
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                <div className="bg-white/5 p-4 rounded-2xl border border-white/5 hover:border-white/10 transition-all">
                                    <p className="text-[9px] uppercase text-gray-100/70 font-bold mb-1">Nombre Completo</p>
                                    <p className="font-black text-white tracking-tight">{profile.nombre} {profile.apellido || ''}</p>
                                </div>
                                <div className="bg-white/5 p-4 rounded-2xl border border-white/5 hover:border-white/10 transition-all">
                                    <p className="text-[9px] uppercase text-gray-100/70 font-bold mb-1">Email de Contacto</p>
                                    <p className="font-black text-white tracking-tight truncate">{profile.email || user.email}</p>
                                </div>
                                <div className="bg-white/5 p-4 rounded-2xl border border-white/5 hover:border-white/10 transition-all">
                                    <p className="text-[9px] uppercase text-gray-100/70 font-bold mb-1">Edad / Nacimiento</p>
                                    <p className="font-black text-white tracking-tight">{profile.edad ? `${profile.edad} años` : 'No set'} {profile.nacimiento ? ` (${profile.nacimiento})` : ''}</p>
                                </div>
                                <div className="md:col-span-2 lg:col-span-3 bg-white/5 p-4 rounded-2xl border border-white/5 hover:border-white/10 transition-all">
                                    <p className="text-[9px] uppercase text-gray-100/70 font-bold mb-1">Intereses y Hobbies</p>
                                    <p className="font-bold text-white tracking-tight italic opacity-80">{profile.hobbies || 'Cuentanos tus hobbies para personalizar tus consejos.'}</p>
                                </div>
                            </div>
                        )}
                    </div>
                    {/* FRASE DEL DIA */}
                    <div className="glass p-6 rounded-[2rem] border border-white/10 bg-gradient-to-br from-blue-600/10 to-transparent">
                        <div className="flex items-center gap-4">
                            <span className="text-3xl">✨</span>
                            <div>
                                <p className="text-[10px] uppercase text-blue-400 font-bold tracking-widest mb-1">Inspiración del día</p>
                                <p className="text-sm font-medium italic text-white/80">"{quote}"</p>
                            </div>
                        </div>
                    </div>


                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                        {/* PERFORMANCE CARDS */}
                        <div className="glass p-6 rounded-[2rem] border border-white/10">
                            <p className="text-[10px] uppercase text-gray-100/90 font-bold mb-3">Rendimiento Ahorro</p>
                            <div className="flex items-end justify-between">
                                <p className="text-2xl font-black">{formatARS(totals.ahorro + totals.inversiones)}</p>
                                <span className={`text-xs font-bold px-2 py-1 rounded-lg ${comparisonData.ahorroPct >= 0 ? 'text-emerald-400 bg-emerald-400/10' : 'text-rose-400 bg-rose-400/10'}`}>
                                    {comparisonData.ahorroPct >= 0 ? '↑' : '↓'} {Math.abs(comparisonData.ahorroPct).toFixed(1)}%
                                </span>
                            </div>
                        </div>

                        <div className="glass p-6 rounded-[2rem] border border-white/10">
                            <p className="text-[10px] uppercase text-gray-100/90 font-bold mb-3">Eficiencia Gastos</p>
                            <div className="flex items-end justify-between">
                                <p className="text-2xl font-black">{formatARS(totals.gastos)}</p>
                                <span className={`text-xs font-bold px-2 py-1 rounded-lg ${comparisonData.gastosPct <= 0 ? 'text-emerald-400 bg-emerald-400/10' : 'text-rose-400 bg-rose-400/10'}`}>
                                    {comparisonData.gastosPct <= 0 ? '↑' : '↓'} {Math.abs(comparisonData.gastosPct).toFixed(1)}%
                                </span>
                            </div>
                        </div>

                        <div className="glass p-6 rounded-[2rem] border border-white/10">
                            <p className="text-[10px] uppercase text-gray-100/90 font-bold mb-3">Estado Financiero</p>
                            <div className="flex items-center gap-3">
                                <div className={`w-3 h-3 rounded-full ${totals.balance >= 0 ? 'bg-emerald-400 shadow-[0_0_10px_rgba(52,211,153,0.5)]' : 'bg-rose-400 shadow-[0_0_10px_rgba(251,113,133,0.5)]'}`}></div>
                                <p className="text-sm font-bold">{totals.balance >= 0 ? 'Saludable' : 'En riesgo'}</p>
                            </div>
                            <p className="text-[10px] text-gray-100/70 mt-2">{insights[0]?.text || "Sigue registrando para más insights."}</p>
                        </div>
                    </div>

                    {/* ESTADO DE SINCRONIZACIÓN REAL (Informativo) */}
                    <div className="glass p-6 rounded-[2rem] border border-white/5 bg-white/5">
                        <div className="flex justify-between items-center mb-4">
                            <div>
                                <h3 className="text-xs font-black uppercase tracking-widest text-blue-400">Nube ARS Pro</h3>
                                <p className="text-[9px] text-gray-100/70 uppercase mt-1">ID: {user?.uid}</p>
                            </div>
                            <div className="px-2 py-1 rounded-lg text-[9px] font-black uppercase tracking-widest bg-emerald-500/10 text-emerald-400 flex items-center gap-1">
                                <span className="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> Sincronizado
                            </div>
                        </div>

                        <div className="grid grid-cols-2 gap-3 mb-4">
                            <div className="p-3 rounded-xl bg-black/20 border border-white/5">
                                <p className="text-[8px] text-white/40 uppercase font-black mb-1">Registros en Nube</p>
                                <p className="text-xs font-bold">{syncInfo.cloudCount} Movs</p>
                            </div>
                            <div className="p-3 rounded-xl bg-black/20 border border-white/5">
                                <p className="text-[8px] text-white/40 uppercase font-black mb-1">Backup</p>
                                <p className="text-xs font-bold text-blue-400">En tiempo real</p>
                            </div>
                        </div>
                        <div className="flex flex-col gap-2">
                            <p className="text-[8px] text-white/40 text-center uppercase tracking-tighter italic mb-2">Tus datos se guardan instantáneamente al detectar cambios.</p>
                            <button
                                onClick={onDeleteAccount}

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">

                        <div className="glass p-8 rounded-[2.5rem] border border-white/10">

                                        <label className="text-[9px] uppercase text-gray-100/90 font-bold block mb-2 px-1">Nombre / Razón Social</label>
                                        <input type="text" value={tempInfo.nombre} onChange={e => setTempInfo({ ...tempInfo, nombre: e.target.value })} onKeyDown={e => e.key === 'Enter' && handleSaveInfo()} className="w-full p-4 bg-white/5 border border-white/10 rounded-2xl outline-none focus:border-blue-500 transition-all font-medium text-sm" />
                                    </div>
                                    <div>
                                        <label className="text-[9px] uppercase text-gray-100/90 font-bold block mb-2 px-1">CUIL / CUIT</label>
                                        <input type="text" value={tempInfo.cuil} onChange={e => setTempInfo({ ...tempInfo, cuil: e.target.value })} onKeyDown={e => e.key === 'Enter' && handleSaveInfo()} className="w-full p-4 bg-white/5 border border-white/10 rounded-2xl outline-none focus:border-blue-500 transition-all font-medium text-sm" />
                                    </div>
                                    <div className="flex gap-3 mt-6">
                                        <button onClick={() => setIsEditingInfo(false)} className="flex-1 py-3 rounded-xl border border-white/10 text-xs font-bold hover:bg-white/5 transition-all">Cancelar</button>
                                        <button onClick={handleSaveInfo} className="flex-1 py-3 rounded-xl bg-blue-600 text-xs font-bold hover:bg-blue-700 transition-all">Guardar</button>
                                    </div>
                                </div>
                            ) : (
                                <div className="space-y-6">
                                    <div className="bg-white/5 p-4 rounded-2xl border border-white/5">
                                        <p className="text-[9px] uppercase text-gray-100/70 font-bold mb-1">Nombre / Razón Social</p>
                                        <p className="text-lg font-black">{profile.nombre || 'No configurado'}</p>
                                    </div>
                                    <div className="bg-white/5 p-4 rounded-2xl border border-white/5">
                                        <p className="text-[9px] uppercase text-gray-100/70 font-bold mb-1">CUIL / CUIT</p>
                                        <p className="text-lg font-black font-mono">{profile.cuil || 'No configurado'}</p>
                                    </div>
                                </div>
                            )}
                        </div>

                        {/* TIENDAS FRECUENTES */}
                        <div className="glass p-8 rounded-[2.5rem] border border-white/10 flex flex-col">
                            <h3 className="text-xs uppercase text-blue-400 font-black tracking-widest mb-6">Tiendas Frecuentes</h3>

                            <div className="flex gap-2 mb-6">
                                <input
                                    type="text"
                                    placeholder="Nueva tienda..."
                                    value={newStore}
                                    onChange={e => setNewStore(e.target.value)}
                                    onKeyDown={e => e.key === 'Enter' && handleAddStore()}
                                    className="flex-1 p-4 bg-white/5 border border-white/10 rounded-2xl outline-none focus:border-blue-500 transition-all font-medium text-sm"
                                />
                                <button onClick={handleAddStore} className="bg-white/10 hover:bg-blue-600 p-4 rounded-2xl transition-all active:scale-95 group">
                                    <span className="scale-125 block group-hover:rotate-90 transition-transform"><Icons.Plus /></span>
                                </button>
                            </div>

                            <div className="flex-1 overflow-y-auto max-h-[300px] custom-scroll space-y-2 pr-2">
                                {(!profile.tiendasFrecuentes || profile.tiendasFrecuentes.length === 0) ? (
                                    <p className="text-center py-12 text-white/40 text-xs font-bold tracking-widest uppercase">No hay tiendas favoritas</p>
                                ) : (
                                    profile.tiendasFrecuentes.map((store, i) => (
                                        <div key={i} className="flex justify-between items-center p-4 bg-gray-900/60 backdrop-blur-md hover:bg-gray-900/80 rounded-2xl border border-white/10 transition-all group animate-stagger" style={{ animationDelay: `${i * 50}ms` }}>
                                            <div className="flex items-center gap-3">
                                                <span className="text-blue-400 font-bold"><Icons.Store /></span>
                                                <span className="text-sm font-bold text-white">{store}</span>
                                            </div>
                                            <button onClick={() => handleRemoveStore(store)} className="opacity-0 group-hover:opacity-100 p-2 text-gray-100/90 hover:text-rose-400 transition-all">
                                                <Icons.X />
                                            </button>
                                        </div>
                                    ))
                                )}
                            </div>
                        </div>

                        {/* INVERSIONES FRECUENTES */}
                        <div className="glass p-8 rounded-[2.5rem] border border-white/10 flex flex-col">
                            <h3 className="text-xs uppercase text-blue-400 font-black tracking-widest mb-6">Acciones / Inversiones</h3>

                            <div className="flex gap-2 mb-6">
                                <input
                                    type="text"
                                    placeholder="Nueva inversión (ej: AAPL)..."
                                    value={newInversion}
                                    onChange={e => setNewInversion(e.target.value)}
                                    onKeyDown={e => e.key === 'Enter' && handleAddInversion()}
                                    className="flex-1 p-4 bg-white/5 border border-white/10 rounded-2xl outline-none focus:border-blue-500 transition-all font-medium text-sm"
                                />
                                <button onClick={handleAddInversion} className="bg-white/10 hover:bg-blue-600 p-4 rounded-2xl transition-all active:scale-95 group">
                                    <span className="scale-125 block group-hover:rotate-90 transition-transform"><Icons.Plus /></span>
                                </button>
                            </div>

                            <div className="flex-1 overflow-y-auto max-h-[300px] custom-scroll space-y-2 pr-2">
                                {(!profile.inversionesFrecuentes || profile.inversionesFrecuentes.length === 0) ? (
                                    <p className="text-center py-12 text-white/40 text-xs font-bold tracking-widest uppercase">No hay inversiones guardadas</p>
                                ) : (
                                    profile.inversionesFrecuentes.map((inv, i) => (
                                        <div key={i} className="flex justify-between items-center p-4 bg-gray-900/60 backdrop-blur-md hover:bg-gray-900/80 rounded-2xl border border-white/10 transition-all group animate-stagger" style={{ animationDelay: `${i * 50}ms` }}>
                                            <div className="flex items-center gap-3">
                                                <span className="text-blue-400 font-bold"><Icons.Trend /></span>
                                                <span className="text-sm font-bold text-white">{inv}</span>
                                            </div>
                                            <button onClick={() => handleRemoveInversion(inv)} className="opacity-0 group-hover:opacity-100 p-2 text-gray-100/90 hover:text-rose-400 transition-all">

                                            </button>

                                    ))
                                )}
                            </div>
                        </div>
                    </div>

                    {/* GESTION DE CATEGORIAS */}
                    <div className="glass p-8 rounded-[2.5rem] border border-white/10">
                        <div className="flex justify-between items-center mb-8">
                            <h3 className="text-xs uppercase text-blue-400 font-black tracking-widest">Personalizar Categorías</h3>
                            <button onClick={() => setShowPilarCreator(true)} className="px-4 py-2 bg-blue-600 hover:bg-blue-700 rounded-xl text-[10px] font-black uppercase tracking-widest transition-all shadow-lg shadow-blue-600/20">
                                + Nuevo Pilar
                            </button>
                        </div>

                        <div className="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-4 mb-8">
                            {Object.entries(profile.categories || PILARES).map(([key, val]) => (
                                <div key={key} className="relative group">
                                    <button
                                        onClick={() => setSelectedPilar(key)}
                                        className={`w-full p-4 rounded-2xl border transition-all flex flex-col items-center gap-2 ${selectedPilar === key ? 'bg-blue-600/20 border-blue-500/50 shadow-[0_0_20px_rgba(79,70,229,0.2)]' : 'bg-white/5 border-white/10 hover:bg-white/10'}`}
                                    >
                                        <span className="text-2xl">{val.icon}</span>
                                        <span className="text-[10px] font-black uppercase tracking-widest">{val.nombre}</span>
                                    </button>
                                    {!['gastos', 'ahorro', 'inversiones', 'ingresos'].includes(key) && (
                                        <button onClick={() => handleRemovePilar(key)} className="absolute -top-1 -right-1 w-6 h-6 bg-rose-500 rounded-full flex items-center justify-center text-white opacity-0 group-hover:opacity-100 transition-all scale-75 hover:scale-100">
                                            <Icons.X />
                                        </button>
                                    )}
                                </div>
                            ))}
                        </div>

                        <div className="bg-white/5 p-6 rounded-[2rem] border border-white/5">
                            <div className="flex flex-col md:flex-row gap-4 mb-6">
                                <input
                                    type="text"
                                    placeholder={`Nueva subcategoría para ${(profile.categories || PILARES)[selectedPilar]?.nombre || ''}...`}
                                    value={newSubcategory}
                                    onChange={e => setNewSubcategory(e.target.value)}
                                    onKeyDown={e => e.key === 'Enter' && handleAddSubcategory()}
                                    className="flex-1 p-4 bg-white/5 border border-white/10 rounded-2xl outline-none focus:border-blue-500 transition-all font-medium text-sm"
                                />
                                <button onClick={handleAddSubcategory} className="bg-blue-600 hover:bg-blue-700 px-8 py-4 rounded-2xl transition-all font-bold text-xs uppercase tracking-widest flex items-center justify-center gap-2">
                                    <Icons.Plus /> Agregar
                                </button>
                            </div>

                            <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
                                {(profile.categories || PILARES)[selectedPilar]?.subcategorias.map((sub, i) => {
                                    const pilar = (profile.categories || PILARES)[selectedPilar];
                                    const isAhorro = pilar.tipo === 'ahorro';
                                    return (
                                        <div key={i} className="flex flex-col gap-3 p-4 bg-white/5 rounded-2xl border border-white/5 group hover:bg-white/10 transition-all">
                                            <div className="flex justify-between items-center">
                                                <span className="text-xs font-black uppercase tracking-wider truncate pr-2">{sub}</span>
                                                <button onClick={() => handleRemoveSubcategory(sub)} className="p-1 text-white/40 hover:text-rose-400 transition-all opacity-0 group-hover:opacity-100">
                                                    <Icons.X />
                                                </button>
                                            </div>
                                            {isAhorro && (
                                                <div className="pt-2 border-t border-white/5">
                                                    <p className="text-[8px] uppercase font-black text-blue-400 mb-1.5 tracking-widest">Meta de Ahorro</p>
                                                    <div className="relative">
                                                        <span className="absolute left-3 top-1/2 -translate-y-1/2 text-[9px] font-bold text-white/30">$</span>
                                                        <input
                                                            type="number"
                                                            placeholder="Monto"
                                                            value={pilar.metas?.[sub] || ''}
                                                            onChange={(e) => handleUpdateMeta(selectedPilar, sub, e.target.value)}
                                                            className="w-full bg-white/5 border border-white/10 rounded-xl py-2 pl-6 pr-3 text-[10px] outline-none focus:border-blue-500 font-bold transition-all"
                                                        />
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    </div>

                    {/* MODAL CREADOR DE PILARES */}
                    {showPilarCreator && (
                        <div className="fixed inset-0 z-[600] flex items-center justify-center p-4 bg-black/80 backdrop-blur-md animate-fade">
                            <div className="glass p-8 rounded-[2.5rem] max-w-md w-full animate-pop border border-white/10 shadow-2xl">
                                <h3 className="text-xl font-black mb-6 text-center">Nuevo Pilar</h3>
                                <div className="space-y-6">
                                    <div>
                                        <label className="text-[10px] uppercase text-gray-100/90 font-bold block mb-2">Nombre del Pilar</label>
                                        <input type="text" placeholder="Ej: Mascotas" value={newPilar.nombre} onChange={e => setNewPilar({ ...newPilar, nombre: e.target.value })} onKeyDown={e => e.key === 'Enter' && handleAddPilar()} className="w-full p-4 bg-white/5 border border-white/10 rounded-2xl outline-none focus:border-blue-500 transition-all font-bold" />
                                    </div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="text-[10px] uppercase text-gray-100/90 font-bold block mb-2">Icono (Emoji)</label>
                                            <input type="text" placeholder="🐶" value={newPilar.icon} onChange={e => setNewPilar({ ...newPilar, icon: e.target.value })} onKeyDown={e => e.key === 'Enter' && handleAddPilar()} className="w-full p-4 bg-white/5 border border-white/10 rounded-2xl text-center text-xl outline-none focus:border-blue-500 transition-all" />
                                        </div>
                                        <div>
                                            <label className="text-[10px] uppercase text-gray-100/90 font-bold block mb-2">Color</label>
                                            <input type="color" value={newPilar.color} onChange={e => setNewPilar({ ...newPilar, color: e.target.value })} className="w-full h-[58px] p-2 bg-white/5 border border-white/10 rounded-2xl cursor-pointer" />
                                        </div>
                                    </div>
                                    <div>
                                        <label className="text-[10px] uppercase text-gray-100/90 font-bold block mb-2">Tipo de Impacto</label>
                                        <select value={newPilar.tipo} onChange={e => setNewPilar({ ...newPilar, tipo: e.target.value })} onKeyDown={e => e.key === 'Enter' && handleAddPilar()} className="w-full p-4 bg-slate-900 border border-white/10 rounded-2xl outline-none focus:border-blue-500 transition-all font-bold appearance-none cursor-pointer">
                                            <option value="gasto">Gasto</option>
                                            <option value="ingreso">Ingreso</option>
                                            <option value="ahorro">Ahorro</option>
                                            <option value="inversion">Inversión</option>
                                        </select>
                                    </div>
                                    <div className="flex gap-4 mt-4">
                                        <button onClick={() => setShowPilarCreator(false)} className="flex-1 py-4 rounded-2xl border border-white/10 font-bold text-xs uppercase tracking-widest hover:bg-white/5 transition-all">Cancelar</button>
                                        <button onClick={handleAddPilar} className="flex-1 py-4 rounded-2xl bg-blue-600 text-white font-bold text-xs uppercase tracking-widest hover:bg-blue-700 transition-all shadow-lg shadow-blue-600/30">Crear</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    <CloudDiagnostics user={user} />
                </div>
            );
        };

        // ═══════════════════════════════════════════════════════════════
        // COMPONENTE PRINCIPAL
        // ═══════════════════════════════════════════════════════════════
        const App = () => {
            // Función para obtener las llaves de guardado según el usuario
            const getKeys = (u) => ({
                trans: u ? `finanzas_data_${u.uid}` : 'finanzas_data_anon',
                profile: u ? `finanzas_profile_${u.uid}` : 'finanzas_profile_anon'
            });

            // Perfil por defecto
            const DEFAULT_PROFILE = {
                nombre: '',
                apellido: '',
                email: '',
                nacimiento: '',
                edad: '',
                hobbies: '',
                cuil: '',
                tiendasFrecuentes: [],
                inversionesFrecuentes: [],
                categories: { ...PILARES }
            };

            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);

            // Estado inicial vacío (se cargará al detectar el usuario)
            const [transactions, setTransactions] = useState([]);
            const [profile, setProfile] = useState(DEFAULT_PROFILE);

            const [activeTab, setActiveTab] = useState(() => localStorage.getItem('activeTab') || 'dashboard');
            const [showModal, setShowModal] = useState(false);
            const [editingId, setEditingId] = useState(null);
            const [toast, setToast] = useState(null);
            const [deleteConfirm, setDeleteConfirm] = useState(null);
            const [timeFilter, setTimeFilter] = useState('mes');

            const [formData, setFormData] = useState({
                articulo: '', tienda: '', monto: '', fecha: today(), seccion: 'gastos', subcategoria: 'Alquiler',
                metodoPago: 'efectivo', cuotas: '1', cuotaActual: '1', diaVencimiento: '10', moneda: 'ARS',
                formTab: 'gastos', plataforma: '', inversionTipo: 'Acciones', fuenteIngreso: 'Sueldo', accionCripto: 'Compra Directa', cryptoTicker: ''
            });

            const hasSynced = useRef(false);
            const isInitialLoadDone = useRef(false);

            const [showFilterMenu, setShowFilterMenu] = useState(false);
            const [compareMode, setCompareMode] = useState('standard');
            const [periodA, setPeriodA] = useState(new Date().toISOString().slice(0, 7));
            const [periodB, setPeriodB] = useState(() => {
                const d = new Date(); d.setMonth(d.getMonth() - 1);
                return d.toISOString().slice(0, 7);
            });
            const [syncInfo, setSyncInfo] = useState({
                status: 'sincronizando',
                lastServerUpdate: null,
                isLocal: true,
                cloudCount: 0
            });
            const [isSaving, setIsSaving] = useState(false);

            // Aviso de Entorno
            useEffect(() => {
                const isLocal = window.location.hostname.includes('localhost') ||
                    window.location.hostname.includes('127.0.0.1') ||
                    window.location.protocol === 'file:';

                if (!isLocal && window.location.hostname) {
                    console.warn('⚠️ AVISO: Estás en producción. Los cambios locales NO se verán aquí hasta que hagas "push" a GitHub.');
                }
            }, []);

            // Lógica de recuperación manual (Force Pull)
            const forcePull = async () => {
                if (!user || user.isAnonymous) return;

                // 1. Verificación básica de internet
                if (!navigator.onLine) {
                    showToast('No tienes conexión a internet', 'error');
                    return;
                }

                setSyncInfo(prev => ({ ...prev, status: 'descargando' }));
                try {
                    // Force pull simplificado: Solo avisamos si no hay datos en la nueva ruta
                    showToast('Buscando datos en la nube...', 'info');
                } catch (e) {
                    console.error('Error in forcePull:', e);
                    showToast('Error al buscar datos', 'error');
                }
            };


            // 1. PERSISTENCIA LOCAL (localStorage)
            // Cargar datos cuando el usuario cambia
            useEffect(() => {
                if (!user) return; // Esperar al auth listener

                const keys = getKeys(user);
                const savedTrans = localStorage.getItem(keys.trans);
                const savedProfile = localStorage.getItem(keys.profile);

                if (savedTrans) {
                    try { setTransactions(JSON.parse(savedTrans)); } catch (e) { }
                } else {
                    // MIGRACIÓN: Buscar datos en cualquier llave vieja disponible
                    const legacyKeys = ['finanzas_ars_pro_data', 'finanzas_ars_v1_data', 'finanzas_ars_pro_v1'];
                    for (const lKey of legacyKeys) {
                        const legacy = localStorage.getItem(lKey);
                        if (legacy) {
                            try {
                                const parsed = JSON.parse(legacy);
                                if (Array.isArray(parsed) && parsed.length > 0) {
                                    setTransactions(parsed);
                                    break;
                                }
                            } catch (e) { }
                        }
                    }
                }

                if (savedProfile) {
                    try { setProfile(JSON.parse(savedProfile)); } catch (e) { }
                }

                // Marcamos que la carga inicial local terminó
                isInitialLoadDone.current = true;
            }, [user]);

            // Guardar en localStorage
            useEffect(() => {
                // GUARDIA DE PERSISTENCIA: No guardar si:
                // 1. Aún está cargando
                // 2. No hay usuario
                // 3. NO hemos terminado la carga inicial de local (evita borrar datos en el arranque)
                if (loading || !user || !isInitialLoadDone.current) return;

                const keys = getKeys(user);
                localStorage.setItem(keys.trans, JSON.stringify(transactions));
                localStorage.setItem(keys.profile, JSON.stringify(profile));
                localStorage.setItem('activeTab', activeTab);
            }, [transactions, profile, activeTab, loading, user]);

            // 2. SINCRONIZACIÓN NUBE (Firebase Firestore)
            useEffect(() => {
                if (!user || user.isAnonymous) {
                    hasSynced.current = true;
                    setLoading(false); // Si es anónimo o no hay user, no hay snap que esperar
                    return;
                }

                console.log('--- Iniciando Listeners de Nube ---');
                setLoading(true); // Aseguramos que el logo de carga aparezca al entrar

                // A. Escuchar PERFIL
                const profilePath = `usuarios/${user.uid}/datos/perfil`;
